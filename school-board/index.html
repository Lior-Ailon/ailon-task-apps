<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>לוח בית הספר</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-dark:#2563eb;--orange:#f59e0b;--orange-dark:#f97316;
  --green:#22c55e;--green-dark:#16a34a;--purple:#8b5cf6;--purple-dark:#7c3aed;
  --teal:#14b8a6;--teal-dark:#0f766e;
  --pad:clamp(6px,1.2vw,32px);
  --gap:clamp(5px,.8vw,18px);
  --radius:clamp(16px,2.5vw,64px);
  --card-radius:clamp(8px,.8vw,24px);
  --topbar-h:clamp(30px,3.6vw,80px);
  --bar-h:clamp(36px,4.5vw,100px);
  --fs-title:clamp(1.8rem,4vw,6rem);
  --fs-subtitle:clamp(.8rem,1.5vw,3rem);
  --fs-clock:clamp(1.1rem,3vw,6rem);
  --fs-clock-date:clamp(.65rem,1.2vw,2.5rem);
  --fs-clock-next:clamp(.6rem,1vw,2rem);
  --fs-news-head:clamp(.9rem,2vw,4rem);
  --fs-news-card:clamp(.75rem,1.3vw,2.5rem);
  --fs-news-desc:clamp(.65rem,1vw,2rem);
  --fs-ticker:clamp(.75rem,1.4vw,2.8rem);
  --fs-ticker-label:clamp(.8rem,1.5vw,3rem);
  --fs-caption:clamp(.8rem,1.8vw,3.5rem);
  --fs-ph-icon:clamp(32px,5vw,128px);
  --fs-ph-text:clamp(.9rem,1.8vw,3.5rem);
}
html{height:100%;width:100%}
body{height:100%;width:100%;margin:0;padding:0;font-family:'Heebo',system-ui,sans-serif;background:#fff;color:#1e293b;overflow:hidden}
#frame{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ===== טיקר עליון — RSS ===== */
.rss-bar{flex-shrink:0;height:var(--topbar-h);display:flex;align-items:center;gap:clamp(8px,1vw,16px);background:linear-gradient(135deg,var(--blue),var(--blue-dark));box-shadow:0 2px 10px rgba(0,0,0,.15);padding:0 clamp(10px,1.3vw,24px);overflow:hidden}
.rss-label{display:flex;align-items:center;gap:6px;flex-shrink:0;color:#fff;font-weight:800;font-size:var(--fs-ticker-label);border-left:2px solid rgba(255,255,255,.3);padding-left:clamp(8px,1vw,14px)}
.rss-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;direction:ltr}
.rss-track{display:flex;gap:clamp(20px,2.5vw,40px);white-space:nowrap;direction:ltr;animation:tickerLTR 120s linear infinite}
.rss-track:hover{animation-play-state:paused}
@keyframes tickerLTR{from{transform:translateX(0%)}to{transform:translateX(-50%)}}
.rss-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:var(--fs-ticker);font-weight:500;direction:rtl}
.rss-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}

.wrap{width:100%;flex:1;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad) var(--pad);padding-bottom:calc(var(--bar-h) + 2*var(--pad));min-height:0;overflow:hidden}
.header{display:flex;gap:var(--gap);flex-shrink:0;align-items:stretch}
.header-right{flex-shrink:0;width:clamp(120px,13vw,420px)}
.header-center{flex:1;display:flex;gap:var(--gap);align-items:stretch}
.header-left{flex-shrink:0;width:clamp(84px,7.5vw,240px)}
.rect{border-radius:var(--radius);padding:clamp(8px,1.2vw,32px) clamp(12px,1.5vw,40px);display:flex;align-items:center;justify-content:center;gap:clamp(6px,.8vw,12px);box-shadow:0 4px 14px rgba(0,0,0,.10)}
/* ימין = שעון + תאריך + הפסקה הבאה */
.rect-clock{width:100%;height:100%;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;flex-direction:column;gap:clamp(3px,.5vw,8px)}
.rect-clock .clock-num{font-size:var(--fs-clock);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;direction:ltr}
.rect-clock .clock-date{font-size:var(--fs-clock-date);opacity:.9;text-align:center;width:100%}
.rect-clock .clock-next{font-size:var(--fs-clock-next);opacity:.95;text-align:center;width:100%;background:rgba(255,255,255,.18);border-radius:clamp(6px,.6vw,14px);padding:2px clamp(6px,.8vw,12px)}
/* מרכז = שם בית הספר */
.rect-school{flex:1;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;gap:clamp(8px,1vw,16px)}
.rect-school .txt{text-align:center}
.rect-school .txt h2{font-size:var(--fs-title) !important;font-weight:900 !important;line-height:1.1 !important}
.rect-school .txt p{font-size:var(--fs-subtitle);opacity:.85;margin-top:2px}
/* שמאל = מיתוג */
.rect-brand{width:100%;height:100%;background:linear-gradient(160deg,#e8c274,#d9a441);color:#0e1b17;flex-direction:column;gap:clamp(2px,.3vw,6px);box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.rect-brand .b-icon{width:clamp(20px,2.8vw,44px);height:clamp(20px,2.8vw,44px);border-radius:clamp(6px,1vw,14px);object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rect-brand .b-text{font-size:clamp(.7rem,1.2vw,1.4rem);font-weight:800;letter-spacing:.05em;line-height:1.1;text-align:center;color:#0e1b17}
.rect-brand .b-sub{font-size:clamp(.5rem,.8vw,1rem);font-weight:600;letter-spacing:.1em;line-height:1;color:#1e4a3d;opacity:.8;text-align:center}

.body-grid{flex:1;display:flex;gap:var(--gap);min-height:0;overflow:hidden;margin-top:0}
.photo-panel{flex:1.3;border-radius:32px !important;clip-path:inset(0 round 32px);overflow:hidden;position:relative;background:linear-gradient(135deg,#0f766e,#134e4a);box-shadow:0 6px 18px rgba(0,0,0,.12);min-height:0}
.photo-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease-in-out;overflow:hidden;border-radius:32px !important}
.photo-slide.on{opacity:1}
.photo-slide img,.photo-slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:32px !important;display:block}
.photo-slide video{object-fit:contain;background:#0a1512}
.photo-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.5);gap:10px}
.photo-ph .t{font-size:var(--fs-ph-text);font-weight:700;color:#fff}
.photo-dots{position:absolute;top:clamp(8px,1vw,14px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.photo-dot{width:clamp(5px,.5vw,8px);height:clamp(5px,.5vw,8px);border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s}
.photo-dot.active{background:#fff;width:clamp(14px,1.3vw,24px);border-radius:4px}

.news-panel{flex:1;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.news-head{padding:clamp(8px,1vw,18px) clamp(10px,1.3vw,22px);flex-shrink:0;text-align:center;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff}
.news-head h2{font-size:var(--fs-news-head);font-weight:900}
.news-body{flex:1;overflow:hidden;padding:clamp(8px,1vw,18px) clamp(10px,1.2vw,20px);background:linear-gradient(180deg,#fff,#f8fafc);position:relative;min-height:0}
.news-body::before,.news-body::after{content:"";position:absolute;left:0;right:0;height:clamp(16px,1.5vw,28px);z-index:2;pointer-events:none}
.news-body::before{top:0;background:linear-gradient(180deg,#fff,transparent)}
.news-body::after{bottom:0;background:linear-gradient(0deg,#f8fafc,transparent)}
.news-scroll{display:flex;flex-direction:column;gap:clamp(6px,.7vw,12px);animation:scrollUp 180s linear infinite}
.news-scroll:hover{animation-play-state:paused}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.news-card{background:#fff;border-radius:var(--card-radius);padding:clamp(8px,1vw,16px) clamp(10px,1.2vw,18px);display:flex;gap:clamp(6px,.8vw,12px);align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.news-card .badge{width:clamp(22px,2vw,36px);height:clamp(22px,2vw,36px);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(11px,1vw,16px)}
.news-card .badge.b-blue{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.news-card .badge.b-orange{background:linear-gradient(135deg,#f97316,#c2410c)}
.news-card .badge.b-green{background:linear-gradient(135deg,#22c55e,#15803d)}
.news-card .badge.b-purple{background:linear-gradient(135deg,#a855f7,#7e22ce)}
.news-card .badge.b-teal{background:linear-gradient(135deg,#14b8a6,#0f766e)}
.news-card .badge.b-pink{background:linear-gradient(135deg,#ec4899,#be185d)}
.news-card .badge.b-gold{background:linear-gradient(135deg,#eab308,#a16207)}
.news-card .badge.b-red{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.news-card .txt{font-size:var(--fs-news-card);font-weight:600;color:#1e293b;line-height:1.35}
.news-card .desc{font-size:var(--fs-news-desc);color:#64748b;margin-top:2px;line-height:1.4}
.news-card .event-date{display:inline-block;background:#fef3c7;color:#92400e;font-size:clamp(.6rem,.85vw,.75rem);font-weight:700;padding:2px 8px;border-radius:6px;margin-top:4px}
.news-card .event-time{color:#92400e;font-weight:700}

/* ===== טיקר תחתון — הודעות ===== */
.news-bar{position:fixed;bottom:var(--pad);left:var(--pad);right:var(--pad);height:var(--bar-h);display:flex;align-items:center;gap:clamp(8px,1vw,16px);background:linear-gradient(135deg,var(--green),var(--green-dark));box-shadow:0 4px 14px rgba(0,0,0,.10);padding:0 clamp(10px,1.3vw,24px);overflow:hidden;z-index:10}
.news-label{display:flex;align-items:center;gap:6px;flex-shrink:0;color:#fff;font-weight:800;font-size:var(--fs-ticker-label);border-left:2px solid rgba(255,255,255,.3);padding-left:clamp(8px,1vw,14px)}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;direction:ltr}
.news-track{display:flex;gap:clamp(20px,2.5vw,40px);white-space:nowrap;direction:ltr;animation:tickerLTR 138s linear infinite}
.news-track:hover{animation-play-state:paused}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:var(--fs-ticker);font-weight:500;direction:rtl}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:99;flex-direction:column;gap:18px}
#loading .sp{width:54px;height:54px;border-radius:50%;border:5px solid #e2e8f0;border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

@media(max-width:900px){
  .body-grid{flex-direction:column;min-height:0}
  .photo-panel{min-height:35vh;flex:none;width:100%}
  .news-panel{flex:1;min-height:0}
  .header-right{width:clamp(100px,14vw,180px)}
  .header-left{width:clamp(80px,12vw,150px)}
}
@media(max-width:600px){
  .header{flex-direction:column}
  .header-center{flex-direction:row;width:100%}
  .header-right{width:100%}
  .header-left{width:100%}
  .rss-label span:last-child{display:none}
}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div style="color:#64748b;font-size:1.1rem;font-weight:700">טוען לוח בית הספר...</div></div>
<div id="frame">
  <div class="rss-bar">
    <div class="rss-label"><span>חדשות חיוביות</span></div>
    <div class="rss-ticker"><div class="rss-track" id="rssTrack"><div class="rss-item"><span class="dot"></span><span>טוען...</span></div></div></div>
  </div>
<div class="wrap">
  <div class="header">
    <div class="header-right"><div class="rect rect-clock"><div class="clock-num" id="clock">--:--</div><div class="clock-date" id="dateStr">--</div><div class="clock-next" id="nextBreak"></div></div></div>
    <div class="header-center"><div class="rect rect-school"><div class="txt"><h2 id="schoolName">בית הספר</h2><p id="schoolMotto"></p></div></div></div>
    <div class="header-left"><div class="rect rect-brand"><img class="b-icon" src="https://base44.app/api/apps/69f63b4536d7a2c6688403df/files/mp/public/69f63b4536d7a2c6688403df/7a4620fc5_5c7e0427f_whatsapp_image_1601204834551622.jpg" alt="AILON"><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div class="b-text">AILON</div><div class="b-sub">לוח בית הספר</div></div></div></div>
  </div>
  <div class="body-grid">
    <div class="photo-panel" id="photoPanel">
      <div class="photo-dots" id="photoDots"></div>
    </div>
    <div class="news-panel">
      <div class="news-head"><h2>מה שקורה בבית הספר</h2></div>
      <div class="news-body"><div class="news-scroll" id="newsScroll"><div class="news-card"><div class="badge b-teal"></div><div><div class="txt">טוען עדכונים...</div></div></div></div></div></div>
    </div>
  </div>
</div>
<div class="news-bar">
  <div class="news-label"><span>הודעות</span></div>
  <div class="news-ticker"><div class="news-track" id="newsTrack"><div class="news-item"><span class="dot"></span><span>טוען...</span></div></div></div>
</div>
</div>
<script src="app.js?v=2.0.2"></script>
</body>
</html>
