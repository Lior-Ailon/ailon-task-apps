<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח בית הספר</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{
  --teal:#14b8a6; --teal-dark:#0d9488; --gold:#f59e0b; --pink:#f472b6; --blue:#38bdf8;
  --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#f1f5f9; --dim:#94a3b8;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,Arial,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.page{display:none;width:92%;max-height:78vh;text-align:center}
.page.on{display:block;animation:fade .7s}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:64px;font-weight:800;letter-spacing:1px}
h1 .accent{color:var(--teal)}
.sub{font-size:26px;color:var(--dim);margin-top:10px}
.motto{margin-top:44px;font-size:30px;color:var(--gold);font-style:italic;line-height:1.5}
.big-clock{font-size:120px;font-weight:800;color:var(--teal);margin:30px 0 6px;letter-spacing:4px}
.value-box{margin-top:48px;display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 40px}
.value-box .vt{font-size:22px;color:var(--teal);margin-bottom:8px}
.value-box .vx{font-size:28px;font-weight:700}
/* הודעות */
.ntc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:26px;margin-top:30px}
.ntc{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--teal);border-radius:18px;padding:28px 30px;text-align:right}
.ntc.alt{border-top-color:var(--gold)}
.ntc h3{font-size:27px;margin-bottom:12px;color:var(--teal)}
.ntc.alt h3{color:var(--gold)}
.ntc p{font-size:21px;line-height:1.6;color:var(--text)}
/* אירועים */
.evt-list{display:flex;flex-direction:column;gap:18px;margin-top:30px;max-width:820px;margin-inline:auto}
.evt{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:right}
.evt-date{text-align:center;min-width:96px}
.evt-date .d{font-size:38px;font-weight:800;color:var(--teal)}
.evt-date .m{font-size:17px;color:var(--dim)}
.evt-body h3{font-size:25px;margin-bottom:6px}
.evt-body p{font-size:18px;color:var(--dim)}
.evt-body .loc{color:var(--gold);font-size:16px;margin-top:4px}
.evt-count{font-size:19px;color:var(--teal);white-space:nowrap;font-weight:700}
.evt-next .evt-date .d,.evt-next .evt-date .m{color:var(--gold)}
.evt-next{border-color:var(--gold)}
/* מדיה */
.media-wrap{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.media-wrap video{max-width:86%;max-height:60vh;border-radius:18px;background:#000}
.media-wrap img{max-width:86%;max-height:58vh;border-radius:18px;object-fit:contain}
.media-title{font-size:26px;color:var(--teal);font-weight:700}
/* מערכת שעות */
.sched-wrap{max-width:760px;margin:30px auto 0}
.sched-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 30px;margin-bottom:12px;font-size:24px}
.sched-row .t{font-weight:800;color:var(--teal);min-width:110px}
.sched-row.next{border-color:var(--gold);background:#27303f}
.sched-row.next .t,.sched-row.next .lbl{color:var(--gold)}
.sched-row .lbl{text-align:right;font-weight:600}
/* ימי הולדת */
.bday-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;margin-top:30px}
.bday{background:linear-gradient(160deg,#2a2140,#1e293b);border:1px solid #4a3f66;border-radius:20px;padding:34px 20px;text-align:center}
.bday .bn{font-size:29px;font-weight:800;color:var(--pink)}
.bday .bm{font-size:19px;color:var(--dim);margin-top:8px}
.bday .cake{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--pink);position:relative}
.bday .cake::before{content:'';position:absolute;top:14px;left:14px;right:14px;height:12px;background:#fff3;border-radius:6px}
.bday .cake::after{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:6px;height:16px;background:var(--gold);border-radius:3px}
/* סרגל תחתון */
#bar{position:fixed;bottom:0;left:0;right:0;height:12vh;min-height:80px;background:linear-gradient(90deg,var(--teal-dark),var(--teal));display:flex;justify-content:space-between;align-items:center;padding:0 46px;gap:20px;box-shadow:0 -8px 30px rgba(0,0,0,.45)}
#bar .left,#bar .right{display:flex;align-items:center;gap:38px}
#bar .school{font-size:30px;font-weight:800}
#bar .item{text-align:center}
#bar .item .v{font-size:34px;font-weight:800;line-height:1.05}
#bar .item .l{font-size:15px;opacity:.85}
#bar .clock{direction:ltr}
.nextup{background:#0b1220cc;border-radius:14px;padding:10px 22px;font-size:22px;font-weight:700;color:#fff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5;flex-direction:column;gap:18px}
#loading .sp{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{position:fixed;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:4}
.dots span{width:12px;height:12px;border-radius:50%;background:#ffffff2e}
.dots span.on{background:var(--teal)}
.hidden{display:none}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><div style="color:var(--dim);font-size:20px">טוען לוח בית הספר...</div></div>
<div class="dots hidden" id="dots"></div>

<div id="stage">
  <div class="page" id="p-home">
    <h1 id="h_name">בית הספר</h1>
    <div class="big-clock" id="h_clock">00:00</div>
    <div class="sub" id="h_date"></div>
    <div class="motto hidden" id="h_motto"></div>
    <div class="value-box hidden" id="h_value"></div>
  </div>

  <div class="page" id="p-notices">
    <h1>הודעות <span class="accent">לתלמידים</span></h1>
    <div class="ntc-grid" id="n_grid"></div>
  </div>

  <div class="page" id="p-events">
    <h1>אירועים <span class="accent">קרובים</span></h1>
    <div class="evt-list" id="e_list"></div>
  </div>

  <div class="page" id="p-media">
    <h1 id="m_title">גלריית <span class="accent">בית הספר</span></h1>
    <div class="media-wrap" id="m_wrap"></div>
  </div>

  <div class="page" id="p-schedule">
    <h1 id="s_title">מערכת <span class="accent">היום</span></h1>
    <div class="sched-wrap" id="s_rows"></div>
  </div>

  <div class="page" id="p-birthdays">
    <h1>יום הולדת <span class="accent">שמח!</span></h1>
    <div class="bday-grid" id="b_grid"></div>
  </div>
</div>

<div id="bar" class="hidden">
  <div class="left">
    <div class="school" id="bar_name"></div>
  </div>
  <div class="right">
    <div class="item"><div class="v" id="bar_hdate"></div><div class="l">תאריך עברי</div></div>
    <div class="item"><div class="v clock" id="bar_clock">00:00:00</div><div class="l">שעה</div></div>
    <div class="nextup hidden" id="bar_next"></div>
  </div>
</div>

<script src="app.js?v=1.0.0"></script>
</body>
</html>
