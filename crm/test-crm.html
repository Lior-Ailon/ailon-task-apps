<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Test</title>
<script>
window.__errors=[];
window.addEventListener('error',function(e){
  window.__errors.push(e.message+' | '+e.filename+' | line:'+e.lineno);
});
window.addEventListener('unhandledrejection',function(e){
  window.__errors.push('REJECT: '+(e.reason&&e.reason.message||e.reason));
});
window.__ENV__={VITE_SUPABASE_URL:'https://nmpwsahwalmxplxudndv.supabase.co',VITE_SUPABASE_PUBLISHABLE_KEY:'test'};
window.process={env:window.__ENV__};
window.$_TSR={h:function(){},buffer:[],t:new Map(),initialized:false};
</script>
</head>
<body style="background:#fff;color:#000;font-family:monospace;font-size:14px;padding:20px;margin:0;">
<div id="output">Starting test...</div>
<div id="root"></div>
<script>
var out=document.getElementById('output');
function log(msg,color){
  var d=document.createElement('div');
  d.textContent=msg;
  if(color)d.style.color=color;
  out.appendChild(d);
}

log('Step 1: Checking module support...');
log('Step 2: Loading CRM JS module...');

import('./assets/index-CSxuYVg1.js?v=20260805cr2')
.then(function(mod){
  log('SUCCESS: Module loaded!','green');
  log('Exports: '+Object.keys(mod).join(', '));
  log('Root children: '+document.getElementById('root').children.length);
  if(document.getElementById('root').children.length===0){
    log('WARNING: Root is empty - app may not have rendered','orange');
  }
})
.catch(function(e){
  log('FAILED: '+e.message,'red');
  if(e.stack)log(e.stack.substring(0,400),'red');
});

log('Step 3: Waiting for render...');
setTimeout(function(){
  log('After 3s: Root children='+document.getElementById('root').children.length);
  log('Errors: '+window.__errors.length);
  window.__errors.forEach(function(e){log('  ERR: '+e,'red');});
  log('Root innerHTML length: '+document.getElementById('root').innerHTML.length);
  if(document.getElementById('root').innerHTML.length>0){
    log('Root content preview: '+document.getElementById('root').innerHTML.substring(0,200));
  }
},3000);
</script>
</body>
</html>
