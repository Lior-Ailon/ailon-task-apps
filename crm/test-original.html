<script>
window.__errors = [];
window.addEventListener('error', function(e) {
  window.__errors.push({
    type: 'error',
    message: e.message,
    filename: e.filename,
    line: e.lineno,
    stack: e.error ? e.error.stack.substring(0, 300) : ''
  });
});
window.addEventListener('unhandledrejection', function(e) {
  window.__errors.push({ type: 'rejection', message: e.reason ? (e.reason.message || JSON.stringify(e.reason)) : 'unknown' });
});

<body>
<div id="root"></div>
<div id="diag" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border:2px solid red;padding:10px;font-family:monospace;font-size:12px;max-height:300px;overflow:auto;z-index:99999;"></div>
<script>
setInterval(function() {
  var d = document.getElementById('diag');
  var root = document.getElementById('root');
  var html = '<b>Root children: ' + (root ? root.children.length : 'no root') + '</b><br>';
  html += '<b>Errors: ' + window.__errors.length + '</b><br>';
  window.__errors.forEach(function(err, i) {
    html += '[' + i + '] ' + err.type + ': ' + err.message;
    if (err.filename) html += ' (' + err.filename.split('/').pop() + ':' + err.line + ')';
    html += '<br>';
    if (err.stack) html += '<pre>' + err.stack.substring(0, 200) + '</pre><br>';
  });
  d.innerHTML = html;
}, 1000);
</script>
