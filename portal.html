  <script>
    function filterApps() {
      var query = document.getElementById('searchInput').value.toLowerCase().trim();
      var categories = document.querySelectorAll('.category');
      var found = false;
      categories.forEach(function(cat) {
        var cards = cat.querySelectorAll('.app-card');
        var visibleCount = 0;
        cards.forEach(function(card) {
          var name = card.querySelector('.name').textContent.toLowerCase();
          var desc = card.querySelector('.desc').textContent.toLowerCase();
          if (query === '' || name.includes(query) || desc.includes(query)) {
            card.style.display = '';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });
        if (visibleCount > 0) {
          cat.style.display = '';
          found = true;
        } else {
          cat.style.display = 'none';
        }
      });
      document.getElementById('noResults').style.display = found ? 'none' : 'block';
    }
  </script>
<script>
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(function() {
    if (deferredPrompt && !window.matchMedia("(display-mode: standalone)").matches) {
      var banner = document.createElement("div");
      banner.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#0d9488;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:9999;font-family:Heebo,sans-serif;box-shadow:0 -4px 20px rgba(0,0,0,0.15);";
      banner.innerHTML = "<div style=font-size:14px;font-weight:600;>📱 התקן את AILON Task כאפליקציה</div><div><button id=installBtn style=background:#fff;color:#0d9488;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-family:inherit;cursor:pointer;font-size:13px;margin-left:8px;>התקן</button><button id=dismissBtn style=background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3);padding:8px 12px;border-radius:8px;font-family:inherit;cursor:pointer;font-size:13px;>אחר כך</button></div>";
      document.body.appendChild(banner);
      document.getElementById("installBtn").onclick = function() {
        deferredPrompt.prompt();
        deferredPrompt = null;
        banner.remove();
      };
      document.getElementById("dismissBtn").onclick = function() { banner.remove(); };
    }
  }, 3000);
});
</script>

<div class="ailon-feedback-modal" id="ailonFeedbackModal">
  <div class="header">דעתך חשובה לנו <span class="close" onclick="document.getElementById('ailonFeedbackModal').classList.remove('active')">×</span></div>
  <div class="body">
    <div class="rating" id="ailonRating">

      <button onclick="ailonSetRating(5)">😍</button>
    </div>
    <textarea id="ailonFeedbackText" placeholder="מה היית משפר? איך היה החוויה?"></textarea>
    <button class="submit" onclick="ailonSubmitFeedback()">שלח משוב</button>
  </div>

<script>
var ailonRatingValue=0;
function ailonSetRating(v){
  ailonRatingValue=v;
  var btns=document.getElementById('ailonRating').querySelectorAll('button');
  btns.forEach(function(b,i){b.classList.toggle('active',i<v-1)});
}
function ailonSubmitFeedback(){
  var text=document.getElementById('ailonFeedbackText').value;
  if(ailonRatingValue===0 && !text){alert('בחר דירוג או כתוב משוב');return}
  var appName=document.title.split('·')[0].trim()||'Unknown';
  try{
    // Store feedback locally (can be sent to backend later)
    var feedbacks=JSON.parse(localStorage.getItem('ailon_feedbacks')||'[]');
    feedbacks.push({app:appName,rating:ailonRatingValue,text:text,date:new Date().toISOString()});
    localStorage.setItem('ailon_feedbacks',JSON.stringify(feedbacks));
  }catch(e){}
  document.getElementById('ailonFeedbackModal').classList.remove('active');
  var toast=document.createElement('div');
  toast.className='ailon-feedback-toast';
  toast.textContent='תודה על המשוב! 🙏';
  document.body.appendChild(toast);
  setTimeout(function(){toast.classList.add('show')},10);
  setTimeout(function(){toast.classList.remove('show');setTimeout(function(){toast.remove()},300)},2500);
  document.getElementById('ailonFeedbackText').value='';
  ailonRatingValue=0;
  document.getElementById('ailonRating').querySelectorAll('button').forEach(function(b){b.classList.remove('active')});
}
</script>

var FAV_KEY='ailon_favs', REC_KEY='ailon_recent';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cardHTML(app,withPin){
  var statusTxt = app.s==='live'?'פעיל':(app.s==='beta'?'בטא':'ארכיון');
  var idx = (app.n+' '+app.d+' '+app.c+' '+app.p).toLowerCase();
  var h = '<div class="card-wrap" data-s="'+esc(idx)+'"><a class="app-card" href="'+app.p+'" data-path="'+app.p+'">'+
    '<div class="icon">'+app.i+'</div><div class="name">'+esc(app.n)+'</div>'+
    '<div class="desc">'+esc(app.d)+'</div>'+
    '<span class="status status-'+app.s+'">'+statusTxt+'</span></a>';
  if(withPin){ h += '<button class="pin" data-path="'+app.p+'" aria-label="הוספה למועדפים" title="מועדפים">&#9734;</button>'; }
  h += '</div>';
  return h;
}
function render(){
  var favs = lsGet(FAV_KEY);
  var cat = document.getElementById('catalog');
  var groups = {};
  CATALOG.forEach(function(a){ (groups[a.c]=groups[a.c]||[]).push(a); });
  var html='';
  Object.keys(groups).forEach(function(c){
    html += '<div class="category"><div class="category-title">'+c+'</div><div class="apps-grid">';
    groups[c].forEach(function(a){ html += cardHTML(a,true); });
    html += '</div></div>';
  });
  cat.innerHTML = html;
  document.getElementById('appCount').textContent = CATALOG.length;
  // favorites
  var pf=document.getElementById('pinnedBlock'), pg=document.getElementById('pinnedGrid');
  var favApps = CATALOG.filter(function(a){return favs.indexOf(a.p)>-1});
  if(favApps.length){ pf.style.display=''; pg.innerHTML = favApps.map(function(a){return cardHTML(a,true)}).join(''); }
  else { pf.style.display='none'; pg.innerHTML=''; }
  // recents
  var rec = lsGet(REC_KEY).filter(function(p){return CATALOG.some(function(a){return a.p===p})}).slice(0,4);
  var rb=document.getElementById('recentBlock'), rg=document.getElementById('recentGrid');
  if(rec.length){ rb.style.display=''; rg.innerHTML = rec.map(function(p){return cardHTML(CATALOG.filter(function(a){return a.p===p})[0],false)}).join(''); }
  else { rb.style.display='none'; rg.innerHTML=''; }
  syncPins();
}
function syncPins(){
  var favs = lsGet(FAV_KEY);
  document.querySelectorAll('.pin').forEach(function(b){
    var on = favs.indexOf(b.dataset.path)>-1;
    b.classList.toggle('on', on);
    b.innerHTML = on ? '&#9733;' : '&#9734;';
  });
}
document.addEventListener('click', function(e){
  var pin = e.target.closest('.pin');
  if(pin){
    e.preventDefault(); e.stopPropagation();
    var favs = lsGet(FAV_KEY), p = pin.dataset.path, k = favs.indexOf(p);
    if(k>-1) favs.splice(k,1); else favs.push(p);
    lsSet(FAV_KEY,favs); render();
    return;
  }
  var a = e.target.closest('.app-card');
  if(a && a.dataset.path){
    var rec = lsGet(REC_KEY).filter(function(x){return x!==a.dataset.path});
    rec.unshift(a.dataset.path); lsSet(REC_KEY, rec.slice(0,8));
  }
});
function filterApps(){
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var found = 0;
  document.querySelectorAll('#catalog .category').forEach(function(cat){
    var visible = 0;
    cat.querySelectorAll('.card-wrap').forEach(function(w){
      var t = w.getAttribute('data-s')||'';
      var show = !q || t.indexOf(q)>-1;
      w.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    cat.style.display = visible ? '' : 'none';
    found += visible;
  });
  if(q){ document.getElementById('pinnedBlock').style.display='none'; document.getElementById('recentBlock').style.display='none'; }
  else { var f=lsGet(FAV_KEY).length, r=lsGet(REC_KEY).length; if(f) document.getElementById('pinnedBlock').style.display=''; if(r) document.getElementById('recentBlock').style.display=''; }
  document.getElementById('noResults').style.display = (found===0 && q) ? 'block' : 'none';
}
document.addEventListener('keydown', function(e){
  if(e.key==='/' && document.activeElement.id!=='searchInput'){ e.preventDefault(); document.getElementById('searchInput').focus(); }
  if(e.key==='Escape'){ var s=document.getElementById('searchInput'); if(document.activeElement===s){ s.value=''; filterApps(); s.blur(); } }
});
render();
