<!DOCTYPE html>
<html lang="he" dir="rtl">

<body>

      </div>
      <div class="rain" id="rainFx" style="display:none"></div>

    <div id="omerBox" style="display:none"></div>

<footer id="ftr">

  <div id="ftrAdminWrap"><a id="ftrAdmin" href="admin.html">ניהול</a><span class="ailon-mark">AILON</span></div>
