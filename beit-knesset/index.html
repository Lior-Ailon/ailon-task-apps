<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח הקהילה — שיח יוסף</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="description" content="לוח זמנים, מניינים וזמני היום לבית הכנסת שיח יוסף, נתיבות — AILON Task">
<link rel="stylesheet" href="style.css?v=5.3.0">
</head>
<body>
<header id="hdr">
  <div id="hdrClock">
    <div id="hdrTime">--:--</div>
    <div id="hebDate"></div>
    <div id="hdrGreg"></div>
  </div>
  <div id="hdrMid">
    <div id="shulName">בית הכנסת שיח יוסף</div>
    <div id="shulDedication">על שם הרב יוסף חדד</div>
    <div id="shulCity">נתיבות</div>
    <div id="parsha"></div>
    <div id="special"></div>
  </div>
  <div id="holidayLogo"></div>
</header>

<main id="main">

  <section class="panel active" id="panel-clock">
    <div id="clockCenter">
      <div id="analogWrap">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="silverGrd" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f8e7b0"/>
              <stop offset=".5" stop-color="#d4af37"/>
              <stop offset="1" stop-color="#f0d78a"/>
            </linearGradient>
            <radialGradient id="faceGrd" cx=".5" cy=".42" r=".75">
              <stop offset="0" stop-color="#12244a"/>
              <stop offset=".7" stop-color="#0b1a38"/>
              <stop offset="1" stop-color="#071229"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="96" fill="url(#faceGrd)" stroke="url(#silverGrd)" stroke-width="4"/>
          <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(212,175,55,.4)" stroke-width="1"/>
          <g id="acTicks"></g>
          <g id="acH"><rect x="97.6" y="46" width="4.8" height="57" rx="2.4" fill="url(#silverGrd)"/></g>
          <g id="acM"><rect x="98.7" y="26" width="2.6" height="77" rx="1.3" fill="url(#silverGrd)"/></g>
          <g id="acS"><rect x="99.2" y="30" width="1.6" height="84" rx=".8" fill="#e05252"/><rect x="99.2" y="100" width="1.6" height="18" rx=".8" fill="#e05252"/></g>
          <circle cx="100" cy="100" r="5.5" fill="url(#silverGrd)" stroke="#9a7a24" stroke-width="1.5"/>
        </svg>
      </div>
      <div id="digitalCol">
        <div id="clockTime">--:--</div>
        <div id="clockSeconds"></div>
        <div id="gregDate"></div>
      </div>
    </div>
    <div id="nextCard">
      <div id="nextLabel">המניין הבא</div>
      <div id="nextName">…</div>
      <div id="nextTime">…</div>
      <div id="nextCountdown"></div>
    </div>
  </section>

  <section class="panel" id="panel-zmanim">
    <h2 class="panel-title">זמני היום</h2>
    <div id="zmanimCols">
      <div id="zmanimMain">
        <div id="zmanimGrid"></div>
        <div id="zmanimSpecial"></div>
      </div>
      <div id="zmanimSide">
        <div id="dafBox">
          <div class="side-title">דף יומי</div>
          <div id="dafVal" class="side-val"></div>
        </div>
        <div id="rambamBox">
          <div class="side-title">רמב״ם יומי</div>
          <div id="rambamVal" class="side-val"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-minyan">
    <h2 class="panel-title" id="minyanTitle">סדר היום</h2>
    <div id="minyanList"></div>
  </section>

  <section class="panel" id="panel-halacha">
    <h2 class="panel-title">הלכה יומית</h2>
    <div id="tgBanner"></div>
    <div id="halachaCards"></div>
    <div id="lashonCard"></div>
    <div id="talGeshemBox">
      <div id="tgIcon"></div>
      <div>
        <div class="tg-title">בתפילת העמידה אומרים</div>
        <div id="talGeshem"></div>
      </div>
      <div class="rain" id="rainFx" style="display:none"></div>
    </div>
    <div id="omerBox" style="display:none"></div>
  </section>

</main>

<div id="ticker"><div id="tickerInner"></div></div>
<footer id="ftr">
  <div id="ftrTal"></div>
  <div id="ftrDate"></div>
  <div id="ftrAdminWrap"><a id="ftrAdmin" href="admin.html">ניהול</a><span class="ailon-mark">AILON</span></div>
</footer>

<script type="module" src="app.js?v=5.3.0"></script>
</body>
</html>
