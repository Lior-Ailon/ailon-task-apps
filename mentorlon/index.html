<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="version" content="2026-08-13-v6">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d9488">
<title>Mentor-IT — פלטפורמת המנטורינג של AILON Task</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #f0fdfa; direction: rtl; min-height: 100vh; overflow-x: hidden; background: #0a1a2e; }

  .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-mesh {
    position: absolute; inset: -20%;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(13,148,136,0.35), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(30,58,95,0.45), transparent 60%),
      radial-gradient(ellipse 40% 60% at 50% 50%, rgba(20,184,166,0.25), transparent 60%),
      radial-gradient(ellipse 70% 40% at 70% 20%, rgba(6,182,212,0.2), transparent 60%);
    animation: meshFlow 20s ease-in-out infinite alternate;
  }
  @keyframes meshFlow {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    33%  { transform: translate(-3%,2%) rotate(2deg) scale(1.05); }
    66%  { transform: translate(2%,-3%) rotate(-1deg) scale(1.08); }
    100% { transform: translate(-1%,1%) rotate(1deg) scale(1.03); }
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.5; animation: orbFloat 15s ease-in-out infinite; }
  .orb-1 { width: 300px; height: 300px; background: radial-gradient(circle,#14b8a6,transparent 70%); top: -50px; left: -50px; animation-duration: 18s; }
  .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle,#0ea5e9,transparent 70%); bottom: -100px; right: -80px; animation-duration: 22s; animation-delay: -3s; }
  .orb-3 { width: 250px; height: 250px; background: radial-gradient(circle,#1e3a5f,transparent 70%); top: 40%; left: 60%; animation-duration: 16s; animation-delay: -7s; }
  .orb-4 { width: 200px; height: 200px; background: radial-gradient(circle,#5eead4,transparent 70%); top: 60%; left: 20%; animation-duration: 14s; animation-delay: -10s; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    25%  { transform: translate(30px,-40px) scale(1.1); }
    50%  { transform: translate(-20px,30px) scale(0.95); }
    75%  { transform: translate(40px,20px) scale(1.05); }
  }
  .particles { position: absolute; inset: 0; }
  .particle { position: absolute; width: 3px; height: 3px; background: rgba(94,234,212,0.6); border-radius: 50%; animation: particleRise linear infinite; }
  @keyframes particleRise {
    0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
  }
  .bg-images { position: absolute; inset: 0; opacity: 0.08; }
  .bg-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 3s ease-in-out; }
  .bg-slide.active { opacity: 1; }

  .container { max-width: 460px; margin: 0 auto; padding: 40px 20px 60px; position: relative; z-index: 2; animation: slideUp 0.8s cubic-bezier(0.16,1,0.3,1); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

  .header { text-align: center; margin-bottom: 28px; }
  .header .logo {
    display: inline-flex; align-items: center; justify-content: center; max-width: 280px; height: auto;
    border-radius: 16px; background: rgba(255,255,255,0.08); margin-bottom: 16px;
    border: 1px solid rgba(94,234,212,0.3); overflow: hidden; padding: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(20,184,166,0.3), 0 8px 32px rgba(0,0,0,0.2);
    animation: logoGlow 4s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%, 100% { box-shadow: 0 0 40px rgba(20,184,166,0.3), 0 8px 32px rgba(0,0,0,0.2); }
    50% { box-shadow: 0 0 60px rgba(20,184,166,0.5), 0 8px 32px rgba(0,0,0,0.2); }
  }
  .header h1 {
    font-size: 32px; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px;
    background: linear-gradient(135deg,#5eead4,#67e8f9,#5eead4); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: textShimmer 3s linear infinite;
  }
  @keyframes textShimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
  .header p { font-size: 14px; color: #94a3b8; letter-spacing: 0.5px; }

  .card {
    background: rgba(15,23,42,0.6); border: 1px solid rgba(94,234,212,0.15); border-radius: 20px; padding: 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; }
  .tab { flex: 1; text-align: center; padding: 11px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 14px; color: #64748b; transition: all 0.3s ease; position: relative; z-index: 10; }
  .tab.active { background: linear-gradient(135deg,#14b8a6,#0d9488); color: #f0fdfa; box-shadow: 0 4px 16px rgba(20,184,166,0.4); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
  .field input {
    width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(94,234,212,0.15);
    background: rgba(0,0,0,0.25); color: #f0fdfa; font-size: 15px; font-family: inherit; direction: ltr; text-align: right;
    transition: all 0.3s ease;
  }
  .field input::placeholder { color: #475569; }
  .field input:focus { outline: none; border-color: #14b8a6; background: rgba(20,184,166,0.05); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .field .hint { font-size: 12px; color: #64748b; margin-top: 5px; }

  .submit-btn {
    width: 100%; padding: 15px; margin-top: 8px; border: none; border-radius: 12px;
    background: linear-gradient(135deg,#14b8a6,#0d9488); color: white; font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: inherit; transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(20,184,166,0.3); position: relative; z-index: 10;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(20,184,166,0.5); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg { color: #fca5a5; font-size: 13px; margin-top: 12px; text-align: center; display: none; background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); border-radius: 10px; padding: 10px; backdrop-filter: blur(5px); }
  .form-section { display: none; }
  .form-section.active { display: block; }
  .pwd-strength { margin-top: 6px; height: 4px; border-radius: 2px; transition: all .3s; }
  .pwd-hint { font-size: 11px; margin-top: 4px; }
  .forgot-link { text-align: center; margin-top: 14px; font-size: 13px; color: #5eead4; cursor: pointer; transition: color 0.3s; position: relative; z-index: 10; }
  .forgot-link:hover { color: #67e8f9; }
  .footer-note { text-align: center; font-size: 12px; color: #64748b; margin-top: 24px; }

  .slogan-bar {
    text-align: center; margin-top: 20px; padding: 10px 16px;
    background: rgba(20,184,166,0.08); border: 1px solid rgba(94,234,212,0.12); border-radius: 10px;
    font-size: 13px; color: #5eead4; font-weight: 600; letter-spacing: 0.5px;
    animation: sloganFade 1s ease 0.5s both;
  }
  @keyframes sloganFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .skip-link { position: absolute; top: -40px; right: 0; background: #0d9488; color: #fff; padding: 8px 16px; border-radius: 0 0 8px 8px; font-size: 14px; z-index: 100; text-decoration: none; }
  .skip-link:focus { top: 0; }

  @media (max-width: 768px) {
    .container { padding: 24px 16px 40px; }
    .header h1 { font-size: 26px; }
    .card { padding: 20px; }
    .orb { filter: blur(40px); opacity: 0.4; }
    .orb-1 { width: 200px; height: 200px; } .orb-2 { width: 250px; height: 250px; }
    .orb-3 { width: 180px; height: 180px; } .orb-4 { width: 150px; height: 150px; }
  }
  @media (max-width: 480px) {
    body { font-size: 0.9rem; }
    .container { padding: 16px 12px; }
    .header h1 { font-size: 22px; }
    .card { padding: 18px; border-radius: 16px; }
    .field input { font-size: 16px; padding: 12px 14px; }
    .submit-btn { width: 100%; padding: 14px; }
  }
</style>
</head>
<body>
  <a href="#main-content" class="skip-link">דלג לתוכן</a>
<div class="bg-canvas">
  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="bg-images" id="bgImages">
    <div class="bg-slide active" style="background-image:url('https://media.base44.com/images/public/69f63b4536d7a2c6688403df/2f6a2e360_generated_image.png');"></div>
    <div class="bg-slide" style="background-image:url('https://media.base44.com/images/public/69f63b4536d7a2c6688403df/7ce156b31_generated_image.png');"></div>
    <div class="bg-slide" style="background-image:url('https://media.base44.com/images/public/69f63b4536d7a2c6688403df/3f29eaa81_generated_image.png');"></div>
    <div class="bg-slide" style="background-image:url('https://media.base44.com/images/public/69f63b4536d7a2c6688403df/9fa5008b4_generated_image.png');"></div>
  </div>
  <div class="particles" id="particles"></div>
</div>
<div class="container" id="main-content">
  <div class="header">
    <div class="logo"><img src="https://base44.app/api/apps/69f63b4536d7a2c6688403df/files/mp/public/69f63b4536d7a2c6688403df/1b0b81977_ailon_header_logo.png" alt="AILON Task" style="width:100%;height:auto;object-fit:contain;border-radius:inherit;"></div>
    <h1>Mentor-IT</h1>
    <p>פלטפורמת המנטורינג המרכזית של AILON Task</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">התחברות</div>
      <div class="tab" id="tabRegister" onclick="switchTab('register')">מאמן חדש</div>
    </div>
    <div class="form-section active" id="loginSection">
      <div class="field">
        <label>שם משתמש</label>
        <input type="text" id="loginUsername" placeholder="lior">
      </div>
      <div class="field">
        <label>סיסמה</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()">התחבר לדשבורד</button>
      <div class="forgot-link" onclick="alert('לאיפוס סיסמה צור קשר עם מנהל המערכת בכתובת: liors@ailon-task.com')">שכחתי סיסמה</div>
    </div>
    <div class="form-section" id="registerSection">
      <div class="field">
        <label>שם מלא</label>
        <input type="text" id="regDisplayName" placeholder="לדוגמה: ליאור סופר">
      </div>
      <div class="field">
        <label>שם העסק / מיתוג (לא חובה)</label>
        <input type="text" id="regBusinessName" placeholder="לדוגמה: AILON Task">
      </div>
      <div class="field">
        <label>שם משתמש</label>
        <input type="text" id="regUsername" placeholder="באנגלית, ללא רווחים" style="direction:ltr">
        <div class="hint">זה יהיה גם קוד המאמן שתשלח למתאמנים שלך</div>
      </div>
      <div class="field">
        <label>סיסמה</label>
        <input type="password" id="regPassword" placeholder="לפחות 6 תווים" oninput="checkPwdStrength(this.value)">
        <div class="pwd-strength" id="pwdStrength"></div>
        <div class="pwd-hint" id="pwdHint"></div>
      </div>
      <button class="submit-btn" id="registerBtn" onclick="doRegister()">צור חשבון מאמן</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <div class="slogan-bar">✨ Dream it. Plan it. Achieve it.</div>
  <div class="footer-note">🔒 כל מאמן מקבל מרחב נתונים נפרד ומאובטח</div>
</div>
<script>
const API = 'https://base44.app/api/apps/69f63b4536d7a2c6688403df/functions/mentorlonApi';

(function() {
  var container = document.getElementById('particles');
  for (var i = 0; i < 25; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    var sz = 2 + Math.random() * 3;
    p.style.width = sz + 'px'; p.style.height = sz + 'px';
    container.appendChild(p);
  }
})();

function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
  document.getElementById('loginSection').classList.toggle('active', tab==='login');
  document.getElementById('registerSection').classList.toggle('active', tab==='register');
  document.getElementById('errorMsg').style.display='none';
}
function showError(msg) { const e = document.getElementById('errorMsg'); e.textContent = msg; e.style.display = 'block'; }

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { showError('נא למלא שם משתמש וסיסמה'); return; }
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginBtn').textContent = 'מתחבר...';
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'login', username, password }) });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'שגיאה בהתחברות'); document.getElementById('loginBtn').disabled=false; document.getElementById('loginBtn').textContent='התחבר לדשבורד'; return; }
    localStorage.setItem('mentorlon_username', data.username);
    localStorage.setItem('mentorlon_token', data.token);
    localStorage.setItem('mentorlon_display_name', data.display_name);
    localStorage.setItem('mentorlon_is_admin', data.is_admin || false);
    window.location.href = 'dashboard.html';
  } catch(e) { showError('שגיאת רשת, נסה שוב'); document.getElementById('loginBtn').disabled=false; document.getElementById('loginBtn').textContent='התחבר לדשבורד'; }
}

async function doRegister() {
  const display_name = document.getElementById('regDisplayName').value.trim();
  const business_name = document.getElementById('regBusinessName').value.trim();
  const username = document.getElementById('regUsername').value.trim().toLowerCase();
  const password = document.getElementById('regPassword').value;
  if (!display_name || !username || !password) { showError('נא למלא את כל השדות הנדרשים'); return; }
  if (password.length < 6) { showError('הסיסמה חייבת להיות לפחות 6 תווים'); return; }
  document.getElementById('registerBtn').disabled = true;
  document.getElementById('registerBtn').textContent = 'יוצר חשבון...';
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'register', username, password, display_name, business_name }) });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'שגיאה ביצירת חשבון'); document.getElementById('registerBtn').disabled=false; document.getElementById('registerBtn').textContent='צור חשבון מאמן'; return; }
    localStorage.setItem('mentorlon_username', data.username);
    localStorage.setItem('mentorlon_token', data.token);
    localStorage.setItem('mentorlon_display_name', data.display_name);
    window.location.href = 'dashboard.html';
  } catch(e) { showError('שגיאת רשת, נסה שוב'); document.getElementById('registerBtn').disabled=false; document.getElementById('registerBtn').textContent='צור חשבון מאמן'; }
}

function checkPwdStrength(v) {
  const bar = document.getElementById('pwdStrength');
  const hint = document.getElementById('pwdHint');
  if (!bar) return;
  let score = 0;
  if (v.length >= 6) score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6'];
  const labels = ['חלשה מאוד','חלשה','בינונית','חזקה','חזקה מאוד'];
  bar.style.background = colors[Math.min(score-1,4)] || '#334155';
  bar.style.width = (score*20) + '%';
  hint.textContent = v.length > 0 ? 'חוזק סיסמה: ' + (labels[Math.min(score-1,4)] || 'חלשה מאוד') : '';
  hint.style.color = colors[Math.min(score-1,4)] || '#64748b';
}

(function(){
  var slides = document.querySelectorAll('.bg-slide');
  var idx = 0;
  setInterval(function(){
    slides[idx].classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active');
  }, 6000);
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
</html>
