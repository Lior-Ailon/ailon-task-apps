<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עברנו לכתובת של Info Screen</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#1e4a3d;color:#fdfaf4;font-family:Heebo,sans-serif;text-align:center;padding:24px}
.card{max-width:520px}h1{font-size:1.5rem;font-weight:900;margin:0 0 10px}
p{opacity:.85;line-height:1.6;margin:0 0 18px}
a{display:inline-block;background:#d9a441;color:#14201c;text-decoration:none;font-weight:800;
padding:14px 28px;border-radius:999px}</style>
<script>
(function(){
  var target = 'https://infoscreen.co.il/dekel-library/senior-manager.html' + location.search + location.hash;
  document.addEventListener('DOMContentLoaded', function(){
    var a=document.getElementById('go'); if(a) a.href=target;
    location.replace(target);
  });
})();
</script>
</head>
<body>
<div class="card">
  <h1>המסך עבר לדומיין של Info Screen</h1>
  <p>אם לא עברתם אוטומטית, לחצו על הכפתור.</p>
  <a id="go" href="https://infoscreen.co.il/dekel-library/senior-manager.html">מעבר לכתובת החדשה</a>
</div>
</body>
</html>
