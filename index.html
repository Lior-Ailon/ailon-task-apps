  <title>Info Screen — מערכת ניהול מסכים</title>

    (function(){
      var host = window.location.hostname;
      // If accessed via infoscreen.co.il → Dekel library management
      if (host.indexOf('infoscreen') !== -1) {
        window.location.href = 'dekel-library/';
      } else {
        // Default: AILON Task portal
        window.location.href = 'portal.html';
      }
    })();
  </script>
