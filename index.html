<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AILON Task</title>
  <script>
    (function(){
      var host = window.location.hostname;
      // If accessed via infoscreen.co.il → redirect to Dekel library
      if (host.indexOf('infoscreen') !== -1) {
        window.location.href = 'dekel-library/';
      }
    })();
  </script>
</head>
<body>
  <p>מעביר לדף התדמית...</p>
  <script>
    // Redirect to landing page
    if (!window.location.hostname.match(/infoscreen/)) {
      window.location.href = 'landing/';
    }
  </script>
</body>
</html>
