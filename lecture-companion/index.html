<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>AILON Interpreter</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 14px;background:linear-gradient(135deg,#0d9488,#0e7490);font-size:16px;font-weight:bold;text-align:center;display:flex;justify-content:space-between;align-items:center}
#status{font-size:12px;font-weight:normal;opacity:.95}
main{flex:1;display:flex;flex-direction:column;padding:10px;max-width:1000px;margin:0 auto;width:100%;overflow:hidden;height:calc(100vh - 130px)}
#top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#mic{width:70px;height:70px;border-radius:50%;border:0;background:#14b8a6;color:#04201d;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(20,184,166,.5);flex-shrink:0}
#mic.rec{background:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(239,68,68,.15)}}
#miclabel{font-size:12.5px;color:#94a3b8;line-height:1.5}
.pane{flex:1;background:#1e293b;border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane h2{margin:0;padding:8px 12px;font-size:13px;background:#334155;display:flex;justify-content:space-between}
.pane h2 .st{font-weight:normal;font-size:11px;color:#94a3b8}
.pbody{flex:1;overflow-y:auto;padding:10px 14px;font-size:15px;line-height:1.8}
#enBody{direction:ltr;text-align:left;color:#cbd5e1}
#heBody{color:#5eead4}
.interim{color:#64748b;font-style:italic}
.dim{color:#64748b}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.actions button{padding:12px 6px;border:0;border-radius:12px;background:#334155;color:#e2e8f0;font-size:13.5px;font-weight:bold;cursor:pointer}
.actions button:disabled{opacity:.5}
#endBtn{background:#14b8a6;color:#04201d;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.92);display:none;flex-direction:column;z-index:10}
.overlay.on{display:flex}
.oh{padding:12px 14px;background:#0d9480;font-weight:bold;display:flex;justify-content:space-between;font-size:15px}
.oh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.obody{flex:1;overflow-y:auto;padding:12px;max-width:820px;margin:0 auto;width:100%}
.result{background:#1e293b;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:10px}
.archres{background:#134e4a;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:10px}
.ofoot{padding:10px;display:flex;gap:8px;max-width:820px;margin:0 auto;width:100%}
.ofoot input{flex:1;padding:12px;border-radius:12px;border:0;background:#f8fafc;font-size:15px}
.ofoot button{padding:12px 18px;border:0;border-radius:12px;background:#14b8a6;font-weight:bold;cursor:pointer}
.spin{color:#fcd34d}
</style></head><body>
<header><span>🎧 AILON Interpreter</span><span id="status">כבוי</span></header>
<main>
<div id="top">
<button id="mic" onclick="toggleMic()">🎙️</button>
<div id="miclabel">לחץ להאזנה להרצאה. המיקרופון נשאר פתוח כל הזמן. כל משפט מתורגם מיד בסיומו.</div>
</div>
<div class="pane"><h2>English — live transcript <span class="st" id="enSt"></span></h2><div class="pbody" id="enBody"><span class="dim">התמליל החי יופיע כאן...</span></div></div>
<div style="height:8px"></div>
<div class="pane"><h2>עברית — תרגום חי <span class="st" id="heSt"></span></h2><div class="pbody" id="heBody"><span class="dim">התרגום יופיע כאן...</span></div></div>
<div class="actions">
<button id="endBtn" onclick="endSession()">📝 סיכום סוף סשן</button>
<button id="qBtn" onclick="suggestQ()">❓ הצע שאלות</button>
<button id="chatBtn" onclick="openChat()">💬 צ׳אט</button>
<button id="archBtn" onclick="openArchive()">📚 סיכומים</button>
</div>
</main>

<div class="overlay" id="ov">
<div class="oh"><span id="otitle"></span><button onclick="closeOv()">✕</button></div>
<div class="obody" id="obody"></div>
<div class="ofoot" id="ofoot" style="display:none">
<input id="qinput" placeholder="שאל שאלה על מה שנאמר בהרצאה..." onkeydown="if(event.key==='Enter')sendQ()">
<button onclick="sendQ()">שלח</button>
</div>
</div>

<script>
const API="https://base44.app/api/apps/69f63b4536d7a2c6688403df/functions/lectureHelper";
const LS="lectureCompanionV4";
let recog=null,recording=false,lastEv=0,retryTimer=null,pendingHe='',lastIntTr=0,intTrBusy=false;
let state=load();
const enBody=document.getElementById('enBody'),heBody=document.getElementById('heBody'),
      status=document.getElementById('status'),enSt=document.getElementById('enSt'),heSt=document.getElementById('heSt');

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.sessions)return s}catch(e){}
 return {sessions:[{id:Date.now(),start:new Date().toISOString(),segs:[]}],summaries:[]}}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function cur(){return state.sessions[state.sessions.length-1]}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function setRec(v){document.getElementById('mic').classList.toggle('rec',v);recording=v;
 status.textContent=v?'🔴 מאזין...':'כבוי'}

// --- dedup: Chrome continuous mode re-emits the same sentence ---
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9\u05d0-\u05ea ]/g,' ').replace(/\s+/g,' ').trim()}
function isDup(txt){
 const n=norm(txt); if(!n||n.length<4)return true;
 const segs=cur().segs;
 for(let i=segs.length-1;i>=Math.max(0,segs.length-3);i--){
  const p=norm(segs[i].en);
  if(!p)continue;
  if(n===p||(n.includes(p)||p.includes(n)))return true;
 }
 return false}

function toggleMic(){
 if(recording){recog.stop();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('הדפדפן לא תומך בתמלול חי. השתמש בכרום או אדג׳ במחשב.');return}
 recog=new SR();recog.lang='en-US';recog.continuous=true;recog.interimResults=true;recog.maxAlternatives=1;
 lastEv=Date.now();
 recog.onstart=()=>{setRec(true);lastEv=Date.now()};
 recog.onresult=e=>{lastEv=Date.now();let interim='';let fin='';
  for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}
  renderEn(interim);
  onInterimTr(interim);
  if(fin){const txt=fin.trim();if(txt.length>2&&!isDup(txt)){
   const s={en:txt,he:null,fail:false,pend:false,ts:Date.now()};
   cur().segs.push(s);save();renderEn();translateSeg(s)}}};
 recog.onerror=e=>{if(e.error==='not-allowed'){alert('נדרש אישור מיקרופון. אשר בחלון שנפתח.');setRec(false)}
  else if(e.error!=='no-speech')status.textContent='⚠ '+e.error};
 recog.onend=()=>{if(recording){try{recog.start()}catch(_){}} else setRec(false)};
 try{recog.start()}catch(e){alert('לא הצלחתי להתחיל: '+e)}
}

// keep mic alive: if no speech events for 12s, force restart (Chrome silently drops it)
setInterval(()=>{if(recording&&Date.now()-lastEv>12000){try{recog.stop()}catch(e){}}},4000);

function renderEn(interim){
 const c=cur();
 const dim=enBody.querySelector('.dim');if(dim)dim.remove();
 const base=c.segs.map(s=>s.en).join(' ');
 enBody.innerHTML=esc(base)+(interim?' <span class="interim">'+esc(interim)+'</span>':'');
 enSt.textContent=c.segs.length?c.segs.length+' משפטים':'';
 enBody.scrollTop=enBody.scrollHeight}

function renderHe(){
 const c=cur();
 const done=c.segs.filter(s=>s.he).map(s=>s.he);
 const pending=c.segs.some(s=>!s.he);
 const dim=heBody.querySelector('.dim');if(dim)dim.remove();
 let html=esc(done.join(' '));
 if(pendingHe)html+=' <span class="interim">'+esc(pendingHe)+'</span>';
 if(pending)html+=' <span class="interim">⏳</span>';
 heBody.innerHTML=html;
 heSt.textContent=pending?'⏳ מתרגם את המשפט...':'';
 heBody.scrollTop=heBody.scrollHeight}

// translate the in-progress speech every 3s for a live feel
function onInterimTr(t){
 const now=Date.now();
 if(!t||t.trim().length<15){pendingHe='';if(!intTrBusy)renderHe();return}
 if(now-lastIntTr<3000||intTrBusy)return;
 lastIntTr=now;intTrBusy=true;
 fastTranslate(t).then(h=>{intTrBusy=false;if(h){pendingHe=h;renderHe()}})
 .catch(()=>{intTrBusy=false})}

function translateSeg(s){
 s.pend=true;renderHe();
 fastTranslate(s.en).then(t=>{
  s.pend=false;
  if(t){s.he=t;s.fail=false}
  else{s.fail=true;queueRetry(s)}
  save();renderHe()})}

function queueRetry(s){if(!retryTimer)retryTimer=setInterval(retryFailed,15000)}
function retryFailed(){const c=cur();const bad=c.segs.filter(s=>s.fail);
 if(!bad.length){clearInterval(retryTimer);retryTimer=null;return}
 const s=bad[0];s.fail=false;
 fastTranslate(s.en).then(t=>{if(t){s.he=t;save()}else s.fail=true;renderHe()})}

async function fastTranslate(text){
 // instant path: Google Translate directly from the browser (~0.3s, no API key)
 try{
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q='+encodeURIComponent(text));
  const d=await r.json();
  const out=((d&&d[0])||[]).map(x=>(x&&x[0]?x[0]:'')).join('').trim();
  if(out)return out;
 }catch(e){}
 // fallback: backend Gemini
 return await callAPI({action:'translate',text});
}

async function callAPI(body){
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.text)return d.text;
  throw new Error('no text');
 }catch(e){
  // one retry after 2s (fallback to Gemini inside the function)
  try{await new Promise(res=>setTimeout(res,2000));
   const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   const d=await r.json();
   if(d.text)return d.text;
  }catch(e2){}
  return null}}

function ctx(){return cur().segs.map(s=>s.en).join(' ')}

function endSession(){const btn=document.getElementById('endBtn');
 if(!cur().segs.length){alert('אין עדיין תמליל בסשן הזה');return}
 busy(btn,true,'...כותב');openOv('📝 סיכום סשן');
 document.getElementById('obody').innerHTML='<div class="result spin">כותב סיכום, רגע...</div>';
 callAPI({action:'summarize',text:ctx().slice(0,20000)}).then(sum=>{busy(btn,false);
  if(sum){state.summaries.push({ts:Date.now(),text:sum,count:cur().segs.length});save();
   document.getElementById('obody').innerHTML='<div class="result">'+esc(sum)+'</div>'+
   '<button style="width:100%;padding:14px;border:0;border-radius:12px;background:#14b8a6;font-weight:bold;font-size:15px;cursor:pointer" onclick="newSession()">✅ קיבלתי — פתח סשן חדש</button>';
  }else{document.getElementById('obody').innerHTML='<div class="result">שירות ה-AI עמוס כרגע. נסה שוב בעוד דקה.</div>'}})}

function newSession(){
 state.sessions.push({id:Date.now(),start:new Date().toISOString(),segs:[]});save();
 enBody.innerHTML='<span class="dim">התמליל החי יופיע כאן...</span>';heBody.innerHTML='<span class="dim">התרגום יופיע כאן...</span>';
 enSt.textContent='';heSt.textContent='';pendingHe='';closeOv()}

function busy(btn,b){btn.disabled=b;btn._t=btn.textContent;if(b)btn.textContent='...טוען'}

function suggestQ(){const btn=document.getElementById('qBtn');if(!cur().segs.length){alert('אין עדיין תמליל');return}
 busy(btn,true);openOv('❓ שאלות למרצה');
 document.getElementById('obody').innerHTML='<div class="result spin">מנסח שאלות...</div>';
 callAPI({action:'ask',question:'איזה שאלות כדאי לי לשאול את המרצה על מה שנאמר עד עכשיו? תן 3 שאלות: נוסח באנגלית להגיד בקול + הסבר קצר בעברית.',context:ctx().slice(-4000)}).then(t=>{busy(btn,false);
 document.getElementById('obody').innerHTML=t?'<div class="result">'+esc(t)+'</div>':'<div class="result">ה-AI עמוס, נסה שוב בעוד דקה</div>'})}

function openChat(){openOv('💬 צ׳אט הרצאה');document.getElementById('ofoot').style.display='flex';
 document.getElementById('qinput').focus()}
function sendQ(){const inp=document.getElementById('qinput');const q=inp.value.trim();if(!q)return;inp.value='';
 const b=document.getElementById('obody');b.innerHTML+='<div class="result" style="background:#134e4a">אתה: '+esc(q)+'</div><div class="result spin" id="wait">סוכן AI חושב...</div>';b.scrollTop=b.scrollHeight;
 callAPI({action:'ask',question:q,context:ctx().slice(-4000)}).then(d=>{const w=document.getElementById('wait');if(w)w.remove();
  b.innerHTML+=d?'<div class="result">'+esc(d)+'</div>':'<div class="result">ה-AI עמוס, נסה שוב</div>';b.scrollTop=b.scrollHeight})}

function openArchive(){openOv('📚 סיכומים שמורים');
 const s=state.summaries;
 document.getElementById('obody').innerHTML=s.length?
  [...s].reverse().map(r=>'<div class="archres">*'+new Date(r.ts).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})+' — '+r.count+' משפטים*\n'+esc(r.text)+'</div>').join(''):
  '<div class="result">עדיין אין סיכומים שמורים</div>'}

function openOv(t){document.getElementById('otitle').textContent=t;document.getElementById('obody').innerHTML='';document.getElementById('ofoot').style.display='none';document.getElementById('ov').classList.add('on')}
function closeOv(){document.getElementById('ov').classList.remove('on')}

// restore on load: re-translate anything unfinished
(function(){const c=cur();
 if(c.segs.length){renderEn();renderHe();
  c.segs.filter(s=>!s.he).forEach(s=>{s.fail=false;translateSeg(s)})}
})();
</script></body></html>
