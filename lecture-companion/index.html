<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d9488">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AILON Interpreter</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 14px;background:linear-gradient(135deg,#0d9488,#0e7490);font-size:16px;font-weight:bold;text-align:center;display:flex;justify-content:space-between;align-items:center}
#status{font-size:12px;font-weight:normal;opacity:.95}
main{flex:1;display:flex;flex-direction:column;padding:10px;max-width:820px;margin:0 auto;width:100%;overflow:hidden;height:calc(100vh - 110px)}
#top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#mic{width:74px;height:74px;border-radius:50%;border:0;background:#14b8a6;color:#04201d;font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(20,184,166,.5);flex-shrink:0}
#mic.rec{background:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(239,68,68,.15)}}
#vu{display:flex;align-items:flex-end;gap:3px;height:34px;margin-left:2px}
#vu i{width:5px;background:#334155;border-radius:2px;height:4px;transition:height .12s}
#vu.on i{background:#14b8a6}
#miclabel{font-size:12.5px;color:#94a3b8;line-height:1.5;flex:1}
#dirBtn,#newBtn{padding:10px 12px;border:0;border-radius:12px;background:#334155;color:#e2e8f0;font-weight:bold;cursor:pointer;flex-shrink:0;font-size:14px}
#dirBtn:active,#newBtn:active{background:#0d9488}
#feed{flex:1;overflow-y:auto;background:#1e293b;border-radius:14px;padding:10px 12px;min-height:200px}
.seg{margin-bottom:10px;padding:8px 10px;background:#0f172a;border-radius:10px}
.seg .time{color:#64748b;font-size:11px;margin-bottom:2px}
.seg .src{color:#cbd5e1;font-size:14px;line-height:1.55}
.seg .tr{color:#5eead4;font-size:14px;line-height:1.6;margin-top:4px;font-weight:600}
.seg .tr.fail{color:#f87171}
.dim{color:#64748b}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.actions button{padding:12px 6px;border:0;border-radius:12px;background:#334155;color:#e2e8f0;font-size:13px;font-weight:bold;cursor:pointer}
.actions button:disabled{opacity:.5}
#endBtn{background:#14b8a6;color:#04201d;grid-column:span 3;font-size:15px;padding:14px}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.92);display:none;flex-direction:column;z-index:10}
.overlay.on{display:flex}
.oh{padding:12px 14px;background:#0d9480;font-weight:bold;display:flex;justify-content:space-between;font-size:15px}
.oh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.obody{flex:1;overflow-y:auto;padding:12px;max-width:820px;margin:0 auto;width:100%}
.result{background:#1e293b;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:10px}
.archres{background:#134e4a;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:10px}
.ofoot{padding:10px;display:flex;gap:8px;max-width:820px;margin:0 auto;width:100%}
.ofoot input{flex:1;padding:12px;border-radius:12px;border:0;background:#f8fafc;font-size:15px}
.ofoot button{padding:12px 18px;border:0;border-radius:12px;background:#14b8a6;font-weight:bold;cursor:pointer;color:#04201d}
.spin{color:#fcd34d}
.expRow{display:flex;gap:8px;margin-bottom:10px}
.expRow button{flex:1;padding:13px 6px;border:0;border-radius:12px;font-weight:bold;cursor:pointer;font-size:14px}
.expWord{background:#1d4ed8;color:#fff}
.expPdf{background:#b91c1c;color:#fff}
.expNew{background:#14b8a6;color:#04201d}
</style></head><body>
<header><span>🎧 AILON Interpreter</span><span id="status">כבוי</span></header>
<main>
<div id="top">
<button id="mic" onclick="toggleMic()">🎙️</button>
<div id="vu"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div id="miclabel">לחץ ודבר. כל 15 שניות הדיבור מתומלל ומתורגם אוטומטית (עברית ⇄ אנגלית).</div>
<button id="newBtn" title="פתיחת סשן חדש" onclick="confirmNew()">↻</button>
<button id="dirBtn" onclick="toggleDir()">EN→עב</button>
</div>
<div id="feed"><span class="dim">התמליל והתרגום יופיעו כאן...</span></div>
<div class="actions">
<button id="endBtn" onclick="endSession()">📝 סיכום סוף סשן</button>
<button id="qBtn" onclick="suggestQ()">❓ הצע שאלות</button>
<button id="chatBtn" onclick="openChat()">💬 צ׳אט</button>
<button id="archBtn" onclick="openArchive()">📚 סיכומים</button>
</div>
</main>

<div class="overlay" id="ov">
<div class="oh"><span id="otitle"></span><button onclick="closeOv()">✕</button></div>
<div class="obody" id="obody"></div>
<div class="ofoot" id="ofoot" style="display:none">
<input id="qinput" placeholder="שאל שאלה על מה שנאמר בהרצאה..." onkeydown="if(event.key==='Enter')sendQ()">
<button onclick="sendQ()">שלח</button>
</div>
</div>

<script>
const API="https://base44.app/api/apps/69f63b4536d7a2c6688403df/functions/interpreterAudio";
const LS="lectureCompanionV5";
const OUT_RATE=16000;
const CHUNK_SEC=parseFloat(new URLSearchParams(location.search).get('sec'))||15;
let DIR=localStorage.getItem('lcDir')||'en2he';
let ctx=null,stream=null,proc=null,micSrc=null,gain=null,recording=false;
let acc=[],accSamples=0,wakeLock=null,keepAlive=null;
const QUEUE=[];let inflight=0,ratePauseUntil=0;
const WAVSTORE={}; // מקטעים בטיפול — לניסיון חוזר
let state=load();
const feed=document.getElementById('feed'),status=document.getElementById('status');
const vu=document.getElementById('vu'),vuBars=vu.querySelectorAll('i');

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.sessions)return s}catch(e){}
 return {sessions:[{id:Date.now(),start:new Date().toISOString(),segs:[]}],summaries:[]}}
function save(){
 if(state.sessions.length>10)state.sessions=state.sessions.slice(-10);
 if(state.summaries.length>20)state.summaries=state.summaries.slice(-20);
 try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function cur(){return state.sessions[state.sessions.length-1]}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function setRec(v){document.getElementById('mic').classList.toggle('rec',v);vu.classList.toggle('on',v);
 if(!v)vuBars.forEach(b=>b.style.height='4px')}

// ---------- direction ----------
function applyDir(){
 const t=DIR==='he2en';
 document.getElementById('dirBtn').textContent=t?'עב→EN':'EN→עב';
 document.getElementById('miclabel').textContent=t?
  'לחץ ודבר בעברית. כל 15 שניות הדיבור מתומלל ומתורגם לאנגלית.':
  'לחץ ודבר. כל 15 שניות הדיבור מתומלל ומתורגם לעברית (אנגלית או כל שפה).'}
function toggleDir(){if(recording)stopMic();
 DIR=(DIR==='en2he')?'he2en':'en2he';localStorage.setItem('lcDir',DIR);
 newSession();applyDir()}

// ---------- sessions ----------
function newSession(){
 state.sessions.push({id:Date.now(),start:new Date().toISOString(),segs:[]});save();
 renderSegs();closeOv()}
function confirmNew(){
 const n=cur().segs.filter(s=>!s.pend).length;
 if(n>0&&!confirm('לפתוח סשן חדש? התמליל הנוכחי יישמר בהיסטוריה עד הסיכום הבא.'))return;
 newSession()}

// ---------- mic / recording ----------
async function toggleMic(){recording?stopMic():startMic()}
async function startMic(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})}
 catch(e){alert('נדרש אישור מיקרופון. אשר בחלון שנפתח.');return}
 try{ctx=new (window.AudioContext||window.webkitAudioContext)()}
 catch(e){alert('הדפדפן לא תומך בהקלטה.');return}
 if(ctx.state==='suspended')await ctx.resume();
 try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}
 keepAlive=setInterval(()=>{if(ctx&&ctx.state==='suspended')ctx.resume()},5000);
 micSrc=ctx.createMediaStreamSource(stream);
 proc=ctx.createScriptProcessor(4096,1,1);
 gain=ctx.createGain();gain.gain.value=0;
 proc.onaudioprocess=e=>{
  if(!recording)return;
  const d=e.inputBuffer.getChannelData(0);
  acc.push(new Float32Array(d));accSamples+=d.length;
  updateVU(d);
  if(accSamples>=ctx.sampleRate*CHUNK_SEC)flushChunk(false)};
 micSrc.connect(proc);proc.connect(gain);gain.connect(ctx.destination);
 acc=[];accSamples=0;recording=true;setRec(true);renderSegs()}

function stopMic(){
 recording=false;
 if(accSamples>ctx.sampleRate*1.2)flushChunk(true);
 try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}
 try{if(proc)proc.disconnect()}catch(e){}
 try{if(micSrc)micSrc.disconnect()}catch(e){}
 try{if(ctx)ctx.close()}catch(e){}
 try{if(wakeLock)wakeLock.release()}catch(e){}
 if(keepAlive)clearInterval(keepAlive);
 ctx=null;stream=null;proc=null;micSrc=null;wakeLock=null;acc=[];accSamples=0;
 setRec(false);renderSegs()}

function updateVU(d){
 let sum=0;for(let i=0;i<d.length;i++)sum+=d[i]*d[i];
 const rms=Math.sqrt(sum/d.length);
 const h=Math.min(34,Math.max(4,rms*400));
 const idx=Math.floor(Math.random()*vuBars.length);
 vuBars.forEach((b,i)=>{const target=i===idx?h:Math.max(4,parseInt(b.style.height||4)*0.8);
  b.style.height=target+'px'})}

// ---------- WAV encode + send ----------
function flushChunk(final){
 const samples=mergeAcc();
 acc=[];accSamples=0;
 if(!samples.length)return;
 let sum=0;for(let i=0;i<samples.length;i++)sum+=samples[i]*samples[i];
 if(Math.sqrt(sum/samples.length)<0.003)return; // שקט — לא שולחים
 const wav=encodeWav(downsample(samples,ctx?ctx.sampleRate:48000,OUT_RATE));
 sendChunk(wav)}

function mergeAcc(){const total=acc.reduce((a,b)=>a+b.length,0);
 const out=new Float32Array(total);let o=0;
 for(const b of acc){out.set(b,o);o+=b.length}return out}

function downsample(input,from,to){
 if(from===to)return input;
 const ratio=from/to,len=Math.floor(input.length/ratio);
 const out=new Float32Array(len);
 for(let i=0;i<len;i++){let s=0;
  for(let j=0;j<ratio;j++)s+=input[i*ratio+j];
  out[i]=s/ratio}
 return out}

function encodeWav(samples){
 const len=samples.length,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
 const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');
 ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,OUT_RATE,true);v.setUint32(28,OUT_RATE*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
 ws(36,'data');v.setUint32(40,len*2,true);
 for(let i=0;i<len;i++){let s=Math.max(-1,Math.min(1,samples[i]));
  v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true)}
 let b64='';const u8=new Uint8Array(buf);
 for(let i=0;i<u8.length;i+=0x8000)b64+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
 return btoa(b64)}

function sendChunk(wavB64){
 const id='c'+Date.now()+Math.random().toString(16).slice(2);
 WAVSTORE[id]=wavB64;
 const seg={id,ts:Date.now(),src:'',tr:'',pend:true,tries:0};
 cur().segs.push(seg);save();renderSegs();
 enqueue(seg)}

function enqueue(seg){QUEUE.push(seg);pump()}
function pump(){
 if(Date.now()<ratePauseUntil)return;
 while(inflight<2&&QUEUE.length){const seg=QUEUE.shift();inflight++;
 postChunk(seg).finally(()=>{inflight--;pump()})}}

function postChunk(seg){
 return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({audio:WAVSTORE[seg.id],target:DIR==='he2en'?'en':'he'})})
 .then(r=>r.json())
 .then(d=>{
  if(d.success&&(d.t||d.tr)){seg.src=d.t;seg.tr=d.tr;seg.pend=false;delete WAVSTORE[seg.id]}
  else if(d.success&&!d.t){const i=cur().segs.indexOf(seg);if(i>-1)cur().segs.splice(i,1)} // אין דיבור
  else if(d.message==='rate'){seg.tries++;ratePause(seg);return}
  else failSeg(seg);
  save();renderSegs()})
 .catch(()=>{failSeg(seg);save();renderSegs()})}

function ratePause(seg){
 ratePauseUntil=Date.now()+60000;
 if(seg.tries>12){seg.pend=false;seg.fail=true;seg.tr='⚠ המקטע נכשל — מכסת ה-AI התמלאה';delete WAVSTORE[seg.id]}
 else QUEUE.unshift(seg);
 setTimeout(pump,61000);save();renderSegs()}

function failSeg(seg){
 seg.tries++;
 if(seg.tries<=5){seg.pend=true;
  const delay=Math.min(30000,4000*Math.pow(2,seg.tries-1));
  setTimeout(()=>{const c=cur();if(c.segs.includes(seg)&&seg.pend)enqueue(seg)},delay)}
 else{seg.pend=false;seg.fail=true;seg.tr='⚠ המקטע נכשל אחרי 5 ניסיונות';
  delete WAVSTORE[seg.id]}}

// ---------- render ----------
function renderSegs(){
 const c=cur();
 const pend=c.segs.filter(s=>s.pend).length,done=c.segs.filter(s=>!s.pend).length;
 status.textContent=recording?('🔴 מקליט · '+done+' תורגמו'+(pend?' · '+pend+' בתמלול':'')):(pend?'⏳ מתמלל '+pend+' מקטעים...':'כבוי');
 feed.innerHTML='';
 if(!c.segs.length){feed.innerHTML='<span class="dim">התמליל והתרגום יופיעו כאן...</span>';return}
 const srcDir=DIR==='he2en'?'rtl':'ltr',trDir=DIR==='he2en'?'ltr':'rtl';
 const srcAl=srcDir==='ltr'?'left':'right',trAl=trDir==='ltr'?'left':'right';
 c.segs.forEach(s=>{
  const d=document.createElement('div');d.className='seg';
  const t='<div class="time">⏱ '+fmtTime(s.ts)+'</div>';
  if(s.pend)d.innerHTML=t+'<div class="src"><span class="dim">🎙️ ...מתמלל (ניסיון '+(s.tries+1)+'/3)</span></div>';
  else d.innerHTML=t+
   '<div class="src" dir="'+srcDir+'" style="text-align:'+srcAl+'">'+esc(s.src)+'</div>'+
   '<div class="tr '+(s.fail?'fail':'')+'" dir="'+trDir+'" style="text-align:'+trAl+'">'+(s.fail?esc(s.tr):'🇮🇱 '+esc(s.tr))+'</div>';
  feed.appendChild(d)});
 feed.scrollTop=feed.scrollHeight}

// ---------- AI text actions ----------
async function callAPI(body){
 let lastErr=null;
 for(let i=0;i<3;i++){try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.success&&d.text)return d.text;
  lastErr=d.message}catch(e){lastErr=String(e)}
  await new Promise(res=>setTimeout(res,3000))}
 console.warn('API fail',lastErr);return null}

function ctxText(){return cur().segs.filter(s=>!s.pend&&s.src).map(s=>'['+fmtTime(s.ts)+'] '+s.src).join(' ')}

function busy(btn,b){btn.disabled=b;btn._t=btn.textContent;if(b)btn.textContent='...טוען'}
function unbusy(btn){btn.disabled=false;btn.textContent=btn._t}

function endSession(){const btn=document.getElementById('endBtn');
 const text=ctxText();
 if(!text.trim()){alert('אין עדיין תמליל בסשן הזה. הקלט דיבור או לחץ ↻ לפתיחת סשן חדש.');return}
 busy(btn);openOv('📝 סיכום סשן');
 document.getElementById('obody').innerHTML='<div class="result spin">כותב סיכום, רגע...</div>';
 callAPI({action:'summarize',text:text.slice(0,20000)}).then(sum=>{
  unbusy(document.getElementById('endBtn'));
  if(!sum){document.getElementById('obody').innerHTML='<div class="result">שירות ה-AI עמוס כרגע. נסה שוב בעוד דקה.</div>';return}
  state.summaries.push({ts:Date.now(),text:sum,count:cur().segs.filter(s=>!s.pend).length});save();
  document.getElementById('obody').innerHTML=
   '<div class="expRow">'+
   '<button class="expWord" onclick="exportWord()">📝 ייצוא Word</button>'+
   '<button class="expPdf" onclick="exportPdf()">📄 ייצוא PDF</button></div>'+
   '<div class="result">'+esc(sum)+'</div>'+
   '<div class="expRow"><button class="expNew" onclick="newSession()">✅ קיבלתי — פתח סשן חדש</button></div>'})}

// ---------- export ----------
function lastSummary(){return state.summaries[state.summaries.length-1]}
function mdHtml(t){return esc(t)
 .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
 .replace(/\*(.+?)\*/g,'<i>$1</i>')
 .replace(/\n/g,'<br>')}
function summaryDoc(){
 const s=lastSummary();
 return '<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"><title>AILON סיכום '+
  new Date(s.ts).toLocaleString('he-IL')+'</title><style>body{font-family:Arial,sans-serif;direction:rtl;padding:28px;line-height:1.8;color:#0f172a}h1{color:#0d9488;font-size:22px}h2{color:#0d9488;font-size:16px;margin-top:24px}.meta{color:#64748b;font-size:12px}</style></head><body>'+
  '<h1>AILON Interpreter — סיכום סשן</h1><p class="meta">נוצר: '+new Date(s.ts).toLocaleString('he-IL')+' · '+s.count+' מקטעים</p>'+
  mdHtml(s.text)+'</body></html>'}
function exportWord(){
 const blob=new Blob(['\ufeff'+summaryDoc()],{type:'application/msword'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 const d=new Date(lastSummary().ts);
 a.download='AILON-summary-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.doc';
 a.click();URL.revokeObjectURL(a.href)}
function exportPdf(){
 const w=window.open('','_blank');
 if(!w){exportWord();alert('הדפדפן חסם חלון הדפסה — הורדתי קובץ Word במקום.');return}
 w.document.write(summaryDoc());w.document.close();
 setTimeout(()=>{try{w.print()}catch(e){}},400)}

function suggestQ(){const btn=document.getElementById('qBtn');
 if(!ctxText().trim()){alert('אין עדיין תמליל');return}
 busy(btn);openOv('❓ שאלות למרצה');
 document.getElementById('obody').innerHTML='<div class="result spin">מנסח שאלות...</div>';
 callAPI({action:'ask',question:'איזה שאלות כדאי לי לשאול את המרצה על מה שנאמר עד עכשיו? תן 3 שאלות: נוסח להגיד בקול + הסבר קצר.',context:ctxText()}).then(t=>{
  unbusy(document.getElementById('qBtn'));
  document.getElementById('obody').innerHTML=t?'<div class="result">'+esc(t)+'</div>':'<div class="result">ה-AI עמוס, נסה שוב בעוד דקה</div>'})}

function openChat(){openOv('💬 צ׳אט הרצאה');document.getElementById('ofoot').style.display='flex';
 document.getElementById('qinput').focus()}
function sendQ(){const inp=document.getElementById('qinput');const q=inp.value.trim();if(!q)return;inp.value='';
 const b=document.getElementById('obody');
 b.innerHTML+='<div class="result" style="background:#134e4a;color:#e2e8f0">אתה: '+esc(q)+'</div><div class="result spin" id="wait">סוכן AI חושב...</div>';b.scrollTop=b.scrollHeight;
 callAPI({action:'ask',question:q,context:ctxText()}).then(d=>{
  const w=document.getElementById('wait');if(w)w.remove();
  b.innerHTML+=d?'<div class="result">'+esc(d)+'</div>':'<div class="result">ה-AI עמוס, נסה שוב</div>';b.scrollTop=b.scrollHeight})}

function openArchive(){openOv('📚 סיכומים שמורים');
 const s=state.summaries;
 document.getElementById('obody').innerHTML=s.length?
  [...s].reverse().map(r=>'<div class="archres">*'+new Date(r.ts).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})+' — '+r.count+' מקטעים*\n'+esc(r.text)+'</div>').join(''):
  '<div class="result">עדיין אין סיכומים שמורים</div>'}

function openOv(t){document.getElementById('otitle').textContent=t;document.getElementById('obody').innerHTML='';document.getElementById('ofoot').style.display='none';document.getElementById('ov').classList.add('on')}
