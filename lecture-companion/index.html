<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>עוזר הרצאה חי</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 14px;background:linear-gradient(135deg,#0d9488,#0e7490);font-size:16px;font-weight:bold;text-align:center}
#status{font-size:11px;font-weight:normal;opacity:.9}
main{flex:1;display:flex;flex-direction:column;padding:10px;max-width:100%;overflow:hidden}
#top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
#mic{width:72px;height:72px;border-radius:50%;border:0;background:#14b8a6;color:#04201d;font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(20,184,166,.5);flex-shrink:0}
#mic.rec{background:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(239,68,68,.15)}}
#miclabel{font-size:13px;color:#94a3b8}
.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.pane{background:#1e293b;border-radius:14px;display:flex;flex-direction:column;min-height:0}
.pane h2{margin:0;padding:10px 12px;font-size:14px;background:#334155;border-radius:14px 14px 0 0}
.pane .body{flex:1;overflow-y:auto;padding:10px 12px;font-size:14px;line-height:1.6}
#enBody{direction:ltr;text-align:left;color:#cbd5e1}
#heBody{color:#e2e8f0}
.dim{color:#64748b}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:1;min-width:110px;padding:11px 8px;border:0;border-radius:12px;background:#334155;color:#e2e8f0;font-size:14px;font-weight:bold;cursor:pointer}
.actions button:disabled{opacity:.5}
#chatBtn{background:#0d9488;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.88);display:none;flex-direction:column;z-index:10}
.overlay.on{display:flex}
.oh{padding:12px 14px;background:#0d9488;font-weight:bold;display:flex;justify-content:space-between;font-size:15px}
.oh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.obody{flex:1;overflow-y:auto;padding:12px;max-width:820px;margin:0 auto;width:100%}
.result{background:#1e293b;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.7;margin-bottom:10px}
.ofoot{padding:10px;display:flex;gap:8px;max-width:820px;margin:0 auto;width:100%}
.ofoot input{flex:1;padding:12px;border-radius:12px;border:0;background:#f8fafc;font-size:15px}
.ofoot button{padding:12px 18px;border:0;border-radius:12px;background:#14b8a6;font-weight:bold;cursor:pointer}
.spin{color:#fcd34d}
@media (max-width:760px){.panes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style></head><body>
<header>🎧 עוזר הרצאה חי <span id="status">כבוי</span></header>
<main>
<div id="top">
<button id="mic" onclick="toggleMic()">🎙️</button>
<div id="miclabel">לחץ להתחלת האזנה להרצאה<br>(כרום/אדג' במחשב, רצוי אוזניות)</div>
</div>
<div class="panes">
<div class="pane"><h2>English (live)</h2><div class="body" id="enBody"><span class="dim">התמלול יופיע כאן...</span></div></div>
<div class="pane"><h2>עברית (תרגום חי)</h2><div class="body" id="heBody"><span class="dim">התרגום יופיע כאן...</span></div></div>
</div>
<div class="actions">
<button id="sumBtn" onclick="summarize()">📝 סכם עד עכשיו</button>
<button id="qBtn" onclick="suggestQ()">❓ הצע שאלות למרצה</button>
<button id="chatBtn" onclick="openChat()">💬 שאל את הצ'אט</button>
<button onclick="downloadTxt()">⬇️ שמור תמליל</button>
</div>
</main>

<div class="overlay" id="ov">
<div class="oh"><span id="otitle"></span><button onclick="closeOv()">✕</button></div>
<div class="obody" id="obody"></div>
<div class="ofoot" id="ofoot" style="display:none">
<input id="qinput" placeholder="שאל שאלה על מה שנאמר בהרצאה..." onkeydown="if(event.key==='Enter')sendQ()">
<button onclick="sendQ()">שלח</button>
</div>
</div>

<script>
const API="https://base44.app/api/apps/69f63b4536d7a2c6688403df/functions/lectureHelper";
let recog=null,recording=false,transcript=[],pending="",translating=false;
const enBody=document.getElementById('enBody'),heBody=document.getElementById('heBody'),status=document.getElementById('status');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function setRec(v){document.getElementById('mic').classList.toggle('rec',v);recording=v;
status.textContent=v?'🔴 מאזין...':'כבוי'}

function toggleMic(){
 if(recording){recog.stop();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('הדפדפן לא תומך בתמלול חי. השתמש בכרום או אדג׳ במחשב.');return}
 recog=new SR();recog.lang='en-US';recog.continuous=true;recog.interimResults=true;
 recog.onstart=()=>setRec(true);
 recog.onresult=e=>{let interim='';let fin='';
  for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}
  if(fin){transcript.push(fin.trim());render(interim);maybeTranslate()}
  else render(interim)};
 recog.onerror=e=>{if(e.error==='not-allowed'){alert('נדרש אישור מיקרופון. אשר בחלון שייפתח.');setRec(false)}
  else if(e.error!=='no-speech')status.textContent='⚠ '+e.error};
 recog.onend=()=>{if(recording){try{recog.start()}catch(_){}} else setRec(false)};
 try{recog.start()}catch(e){alert('לא הצלחתי להתחיל: '+e)}
}
function render(interim){
 const full=transcript.join(' ');
 enBody.innerHTML=esc(full)+(interim?'<span class="dim">'+esc(interim)+'</span>':'');
 enBody.scrollTop=enBody.scrollHeight}
function maybeTranslate(){if(translating)return;const t=transcript.join(' ');
 if(t.length-pending.length<220)return;translating=true;
 call({action:'translate',text:t.slice(pending.length||0)},d=>{pending=t;
  heBody.innerHTML=esc(d.text);heBody.scrollTop=heBody.scrollHeight},()=>{},()=>{translating=false})}

async function call(body,onOk,onErr,onDone){
 for(let i=0;i<3;i++){try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.text){onOk(d);return}}catch(e){}}
 onErr();if(onDone)onDone()}

function busy(btn,b,txt){btn.disabled=b;btn._t=btn.textContent;if(b)btn.textContent=txt||'...טוען'}

function summarize(){const btn=document.getElementById('sumBtn');if(!transcript.length){alert('אין עדיין תמליל');return}
busy(btn,true,'...כותב סיכום');openOv('📝 סיכום');
document.getElementById('obody').innerHTML='<div class="result spin">כותב סיכום, רגע...</div>';
call({action:'summarize',text:transcript.join(' ')},d=>{busy(btn,false);
 document.getElementById('obody').innerHTML='<div class="result">'+esc(d.text)+'</div>'},
 ()=>{busy(btn,false);document.getElementById('obody').innerHTML='<div class="result">שירות ה-AI עמוס כרגע, נסה שוב בעוד רגע</div>'})}

function suggestQ(){const btn=document.getElementById('qBtn');busy(btn,true,'...חושב');openOv('❓ שאלות למרצה');
document.getElementById('obody').innerHTML='<div class="result spin">מנסח שאלות...</div>';
call({action:'ask',question:'איזה שאלות כדאי לי לשאול את המרצה על מה שנאמר עד עכשיו? תן 3 שאלות: נוסח באנגלית להגיד בקול + הסבר קצר בעברית.',context:transcript.join(' ')},
 d=>{busy(btn,false);document.getElementById('obody').innerHTML='<div class="result">'+esc(d.text)+'</div>'},
 ()=>{busy(btn,false);document.getElementById('obody').innerHTML='<div class="result">שירות ה-AI עמוס כרגע, נסה שוב</div>'})}

function openChat(){openOv('💬 צ׳אט הרצאה');document.getElementById('ofoot').style.display='flex';
 document.getElementById('qinput').focus()}
function sendQ(){const inp=document.getElementById('qinput');const q=inp.value.trim();if(!q)return;inp.value='';
 const b=document.getElementById('obody');b.innerHTML+='<div class="result" style="background:#134e4a">אתה: '+esc(q)+'</div><div class="result spin" id="wait">סוכן AI חושב...</div>';b.scrollTop=b.scrollHeight;
 call({action:'ask',question:q,context:transcript.join(' ')},d=>{const w=document.getElementById('wait');if(w)w.remove();
  b.innerHTML+='<div class="result">'+esc(d.text)+'</div>';b.scrollTop=b.scrollHeight},
 ()=>{const w=document.getElementById('wait');if(w)w.remove();b.innerHTML+='<div class="result">שירות ה-AI עמוס, נסה שוב</div>'})}
function openOv(t){document.getElementById('otitle').textContent=t;document.getElementById('obody').innerHTML='';document.getElementById('ofoot').style.display='none';document.getElementById('ov').classList.add('on')}
function closeOv(){document.getElementById('ov').classList.remove('on')}
function downloadTxt(){const t=transcript.join('\n');const b=new Blob([t],{type:'text/plain'});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='lecture_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.txt';a.click()}
window.addEventListener('beforeunload',e=>{if(transcript.length){e.preventDefault();e.returnValue=''}});
</script></body></html>
