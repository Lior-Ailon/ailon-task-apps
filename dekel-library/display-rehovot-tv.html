<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>הספרייה הציבורית — רחובות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue-1:#1e5a8a;--blue-2:#2b7cb8;--blue-3:#4a9fd8;--blue-light:#a8d4f0;
  --glass:rgba(255,255,255,.18);--dark:#0f2a40;
  --ink:#0f2a40;--white:#fff;
  --r:20px;--r-sm:12px;
}
html,body{height:100%;width:100%}
body{font-family:'Heebo',system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#05172b;margin:0;padding:6px}
#tvFrame{width:100%;height:100%;box-sizing:border-box}
@media(orientation:landscape) and (min-width:1101px){
  #tvFrame{width:1920px;height:1080px;flex-shrink:0;margin:0 auto;transform-origin:center center}
}

/* Outer TV-frame look: glossy dark bezel */
.tv-bezel{
  height:100%;border-radius:26px;padding:14px;
  background:linear-gradient(160deg,#0a1e33,#03111f);
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 2px 6px rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:12px;
}

/* HEADER bar — blue gradient, glossy */
.header-bar{
  border-radius:18px;position:relative;overflow:hidden;flex-shrink:0;
  background:linear-gradient(180deg,var(--blue-3) 0%, var(--blue-2) 45%, var(--blue-1) 100%);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:grid;grid-template-columns:180px 1fr 140px;align-items:center;
  padding:10px 18px;
}
.header-bar::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);
}
.hdr-logo{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hdr-logo .box{
  width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#fff,#dfeeff);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hdr-logo .txt{color:#fff;font-size:.8rem;font-weight:700;line-height:1.15}
.hdr-title{text-align:center;position:relative;z-index:1}
.hdr-title h1{color:#fff;font-size:1.9rem;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr-mascot{display:flex;align-items:center;justify-content:flex-end;position:relative;z-index:1}
.hdr-mascot .ic{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#fff,#e0f0ff);
  display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.25);
}

/* Slim status bar — clock/date/weather/notifications */
.status-bar{
  flex-shrink:0;border-radius:14px;background:linear-gradient(180deg,#eef6fc,#dceaf5);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:space-between;padding:8px 20px;
  font-size:.92rem;color:var(--dark);
}
.status-item{display:flex;align-items:center;gap:8px;font-weight:600}
.status-item .ic{font-size:1.1rem}
.status-item.clock{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:800;color:var(--blue-1)}
.status-sep{width:1px;height:20px;background:rgba(15,42,64,.15)}

/* BODY — two panels */
.body-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}

.panel{
  border-radius:18px;background:linear-gradient(180deg,#f4f9fd,#e6eff7);
  box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 1px 2px rgba(255,255,255,.6);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;
}

/* Left — photo/video showcase with caption pill */
.photo-stage{flex:1;position:relative;min-height:0;background:#0a1e33}
.photo-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s ease}
.photo-slide.on{opacity:1}
.photo-slide img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.55);gap:12px;text-align:center}
.photo-placeholder .ic{font-size:50px;opacity:.5}
.photo-placeholder .t{font-size:1.1rem;font-weight:700;color:#fff}
.caption-pill{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
  background:linear-gradient(180deg,var(--blue-3),var(--blue-1));color:#fff;
  padding:9px 26px;border-radius:50px;font-size:.95rem;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;
}
.photo-dots{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.photo-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s}
.photo-dot.active{background:#fff;width:22px;border-radius:4px}

/* Right — content panel (text/RSS) */
.content-head{
  padding:14px 22px;background:linear-gradient(180deg,var(--blue-3),var(--blue-2));color:#fff;flex-shrink:0;
  text-align:center;
}
.content-head h2{font-size:1.35rem;font-weight:800}
.content-body{flex:1;overflow:hidden;padding:18px 24px;position:relative}
.content-body::after{
  content:"";position:absolute;bottom:0;left:0;right:0;height:30px;
  background:linear-gradient(0deg,#e6eff7,transparent);pointer-events:none;
}
.content-list{list-style:none;display:flex;flex-direction:column;gap:12px;animation:scrollUp 35s linear infinite}
.content-list:hover{animation-play-state:paused}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.content-item{
  background:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.content-item .num{
  width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue-3),var(--blue-1));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex-shrink:0;
}
.content-item .txt{font-size:.95rem;font-weight:600;color:var(--dark);line-height:1.4}
.content-item .src{font-size:.75rem;color:var(--blue-1);font-weight:800;margin-bottom:2px}

/* Bottom — positive news ticker */
.news-bar{
  height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;border-radius:16px;
  background:linear-gradient(180deg,var(--blue-3),var(--blue-1));
  box-shadow:0 4px 14px rgba(0,0,0,.3);padding:0 22px;overflow:hidden;
}
.news-label{display:flex;align-items:center;gap:8px;flex-shrink:0;color:#fff;font-weight:800;font-size:1rem;
  border-left:2px solid rgba(255,255,255,.3);padding-left:14px}
.news-label .ic{font-size:20px}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.news-track{display:flex;gap:36px;white-space:nowrap;animation:scrollH 55s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes scrollH{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:.95rem;font-weight:500}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;opacity:.7}
.news-item .source{background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:.78rem;padding:2px 8px;border-radius:6px}

@media(max-width:1100px){
  .header-bar{grid-template-columns:1fr;text-align:center;gap:8px;padding:14px}
  .hdr-title h1{font-size:1.4rem}
  .body-grid{grid-template-columns:1fr}
  .status-bar{flex-wrap:wrap;gap:8px}
  .news-bar{height:auto;min-height:56px;flex-wrap:wrap;padding:10px}
}
</style>
</head>
<body>
<div id="tvFrame">
<div class="tv-bezel">

  <!-- HEADER -->
  <div class="header-bar">
    <div class="hdr-logo">
      <div class="box">📚</div>
      <div class="txt">Info Screen<br>Dekel Computers</div>
    </div>
    <div class="hdr-title"><h1>הספרייה הציבורית — רחובות</h1></div>
    <div class="hdr-mascot"><div class="ic">🦉</div></div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-item clock" id="clock">--:--:--</div>
    <div class="status-sep"></div>
    <div class="status-item"><span class="ic">📅</span><span id="dateStr">--</span></div>
    <div class="status-sep"></div>
    <div class="status-item"><span class="ic">☀️</span><span id="tempVal">--°</span></div>
    <div class="status-sep"></div>
    <div class="status-item"><span class="ic">🔔</span><span id="notifCount">0 הודעות</span></div>
  </div>

  <!-- BODY -->
  <div class="body-grid">
    <!-- LEFT: photo/video showcase -->
    <div class="panel">
      <div class="photo-stage" id="photoStage">
        <div class="photo-dots" id="photoDots"></div>
      </div>
    </div>

    <!-- RIGHT: content panel -->
    <div class="panel">
      <div class="content-head"><h2>חדש בספרייה</h2></div>
      <div class="content-body">
        <ul class="content-list" id="contentList"></ul>
      </div>
    </div>
  </div>

  <!-- BOTTOM: positive news -->
  <div class="news-bar">
    <div class="news-label"><span class="ic">😊</span><span>חדשות חיוביות</span></div>
    <div class="news-ticker">
      <div class="news-track" id="newsTrack">
        <div class="news-item"><span class="dot"></span><span>טוען...</span></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// CLOCK
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const days=['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'];
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('dateStr').textContent=days[now.getDay()]+' '+now.getDate()+' ב'+months[now.getMonth()];
}
updateClock();setInterval(updateClock,1000);

// WEATHER (Rehovot)
async function loadWeather(){
  try{
    const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.8928&longitude=34.8113&current_weather=true');
    const data=await res.json();
    if(data.current_weather){document.getElementById('tempVal').textContent=Math.round(data.current_weather.temperature)+'°';}
  }catch(e){document.getElementById('tempVal').textContent='--°'}
}
loadWeather();setInterval(loadWeather,900000);

// SCALE
function scaleFrame(){
  const frame=document.getElementById('tvFrame');
  if(window.innerWidth>1100&&window.innerWidth>window.innerHeight){
    const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    frame.style.transform='scale('+s+')';frame.style.transformOrigin='top center';
  }else{frame.style.transform='none'}
}
scaleFrame();window.addEventListener('resize',scaleFrame);

// PHOTO SHOWCASE with caption pill
const samplePhotos=[
  {title:'פורים בספרייה — 2026',url:''},
  {title:'סדנת כתיבה יוצרת · 15.9',url:''},
  {title:'מפגש סופרים · 22.9',url:''}
];
const photoStage=document.getElementById('photoStage');
const photoDots=document.getElementById('photoDots');
let curPhoto=0;
function renderPhotos(){
  document.querySelectorAll('.photo-slide,.caption-pill').forEach(s=>s.remove());
  samplePhotos.forEach((p,i)=>{
    const slide=document.createElement('div');
    slide.className='photo-slide'+(i===0?' on':'');
    if(p.url){
      slide.innerHTML=`<img src="${p.url}" alt="${p.title}">`;
    }else{
      const emojis=['🎭','✍️','📖','🎨','📚'];
      slide.innerHTML=`<div class="photo-placeholder"><div class="ic">${emojis[i%emojis.length]}</div><div class="t">תמונות מהאירועים שלנו</div></div>`;
    }
    photoStage.insertBefore(slide,photoDots);
  });
  const pill=document.createElement('div');
  pill.className='caption-pill';pill.id='captionPill';
  pill.textContent=samplePhotos[0].title;
  photoStage.appendChild(pill);

  photoDots.innerHTML='';
  samplePhotos.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='photo-dot'+(i===0?' active':'');
    dot.onclick=()=>gotoPhoto(i);
    photoDots.appendChild(dot);
  });
}
function gotoPhoto(n){
  curPhoto=n;
  document.querySelectorAll('.photo-slide').forEach((s,i)=>s.classList.toggle('on',i===n));
  document.querySelectorAll('.photo-dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  const pill=document.getElementById('captionPill');
  if(pill)pill.textContent=samplePhotos[n].title;
}
renderPhotos();
setInterval(()=>gotoPhoto((curPhoto+1)%samplePhotos.length),7000);

// RIGHT PANEL — "חדש בספרייה" content list (numbered, like reference)
async function loadContent(){
  const staticItems=[
    'מאגרי מידע לשימושכם — הכניסה למאגרים היא דרך מחשבי הספרייה בלבד',
    'מאגר חיפה למאמרים בעברית',
    'פרויקט השו״ת המקוון',
    'מילון רב-מילים',
    'קדן — קטלוג הספרייה המקוון'
  ];
  try{
    const res=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml');
    const data=await res.json();
    const list=document.getElementById('contentList');
    if(data.status==='ok'&&data.items&&data.items.length>0){
      const items=data.items.slice(0,8).map(item=>item.title.replace(/<[^>]*>/g,'').substring(0,90));
      const all=[...staticItems,...items];
      list.innerHTML=all.map((t,i)=>`<li class="content-item"><div class="num">${i+1}</div><div class="txt">${t}</div></li>`).join('');
      return;
    }
  }catch(e){}
  document.getElementById('contentList').innerHTML=staticItems.map((t,i)=>`<li class="content-item"><div class="num">${i+1}</div><div class="txt">${t}</div></li>`).join('');
}
loadContent();setInterval(loadContent,300000);

// BOTTOM — positive news
async function loadPositiveNews(){
  const feeds=[
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.thepositiv.com/feed/',source:'חדשות טובות',filter:true},
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml',source:'Ynet',filter:false}
  ];
  for(const feed of feeds){
    try{
      const res=await fetch(feed.url);
      const data=await res.json();
      if(data.status==='ok'&&data.items&&data.items.length>0){
        let items=data.items;
        if(feed.filter){items=items.filter(item=>!item.title.includes('תוכן ממומן')&&!item.title.includes('פרסומות')&&!item.title.includes('ספונסר')&&!item.title.includes('שיתופי פעולה'));}
        if(items.length===0)continue;
        document.getElementById('newsTrack').innerHTML=items.slice(0,15).map(item=>{
          const title=item.title.replace(/<[^>]*>/g,'').replace(/&[#a-zA-Z0-9]+;/g,'').substring(0,120);
          return `<div class="news-item"><span class="dot"></span><span class="source">${feed.source}</span><span>${title}</span></div>`;
        }).join('');
        return;
      }
    }catch(e){}
  }
  const fb=['בישראל: עלייה במספר המתנדבים','מחקר חדש: תוחלת חיים בעלייה','רשות הטבע: עלייה בבעלי חיים מוגנים'];
  document.getElementById('newsTrack').innerHTML=fb.map(t=>`<div class="news-item"><span class="dot"></span><span class="source">חדשות טובות</span><span>${t}</span></div>`).join('');
}
loadPositiveNews();setInterval(loadPositiveNews,300000);
</script>
</body>
</html>
