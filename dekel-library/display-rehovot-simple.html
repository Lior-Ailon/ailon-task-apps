<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ספריית רחובות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-dark:#2563eb;
  --orange:#f59e0b;--orange-dark:#f97316;
  --green:#22c55e;--green-dark:#16a34a;
  --r:20px;
}
html{height:100%}
body{
  font-family:'Heebo',system-ui,sans-serif;
  background:linear-gradient(135deg,#f0f4f8,#e6f0fa);
  color:#1e293b;min-height:100vh;
  -webkit-overflow-scrolling:touch;
}

/* TV mode: lock to 1920x1080, scale to fit, no scroll */
body.tv-mode{overflow:hidden;height:100vh}
body.tv-mode #frame{
  width:1920px;height:1080px;flex-shrink:0;margin:0 auto;
  transform-origin:top center;
}

/* Normal mode: fluid layout, allow scroll */
body:not(.tv-mode){overflow-y:auto;overflow-x:hidden}
body:not(.tv-mode) #frame{width:100%;min-height:100vh}

.wrap{
  width:100%;height:100%;
  display:flex;flex-direction:column;gap:10px;
  padding:10px;
}

/* Two colorful header rectangles */
.top-row{display:flex;gap:10px;flex-shrink:0}
.rect{
  flex:1;border-radius:var(--r);padding:24px 28px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.rect-1{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}
.rect-2{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff}
.rect .ic{font-size:42px;flex-shrink:0}
.rect .txt{text-align:center}
.rect .txt h2{font-size:1.8rem;font-weight:900;line-height:1.1}
.rect .txt p{font-size:.95rem;opacity:.85;margin-top:4px}

/* Main area — images */
.main{
  flex:1;border-radius:var(--r);overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  position:relative;background:#1e293b;min-height:300px;
}
.main img{width:100%;height:100%;object-fit:cover}
.main .placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:300px;color:rgba(255,255,255,.5);gap:12px;
}
.main .placeholder .ic{font-size:52px;opacity:.4}
.main .placeholder .t{font-size:1.2rem;font-weight:700;color:#fff}
.main .caption{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;
  padding:10px 28px;border-radius:50px;font-size:1.1rem;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw;
  text-overflow:ellipsis;overflow:hidden;
}

/* Bottom — positive news ticker */
.news{
  height:68px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  border-radius:var(--r);background:linear-gradient(135deg,var(--green),var(--green-dark));
  box-shadow:0 6px 18px rgba(0,0,0,.12);padding:0 24px;overflow:hidden;
}
.news-label{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  color:#fff;font-weight:800;font-size:1.1rem;
  border-left:2px solid rgba(255,255,255,.3);padding-left:14px;
}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.news-track{display:flex;gap:36px;white-space:nowrap;animation:scroll 55s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:1rem;font-weight:500}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}
.news-item .source{background:rgba(255,255,255,.25);font-weight:800;font-size:.8rem;padding:2px 8px;border-radius:6px}

/* LAPTOP: 1280-1920 */
@media(min-width:1280px) and (max-width:1919px){
  body:not(.tv-mode) #frame{max-width:1600px;margin:0 auto}
  .rect{padding:22px 26px}
  .rect .txt h2{font-size:1.6rem}
  .rect .ic{font-size:38px}
}

/* TABLET: 768-1279 */
@media(min-width:768px) and (max-width:1279px){
  body:not(.tv-mode) #frame{max-width:1024px;margin:0 auto}
  .rect{padding:18px 22px}
  .rect .txt h2{font-size:1.4rem}
  .rect .txt p{font-size:.85rem}
  .rect .ic{font-size:34px}
  .news{height:60px}
  .news-label{font-size:1rem}
  .news-item{font-size:.9rem}
}

/* MOBILE: < 768 */
@media(max-width:767px){
  body:not(.tv-mode){padding:6px}
  body:not(.tv-mode) #frame{width:100%}
  .top-row{flex-direction:column;gap:8px}
  .rect{padding:16px 20px}
  .rect .txt h2{font-size:1.3rem}
  .rect .txt p{font-size:.8rem}
  .rect .ic{font-size:30px}
  .main{min-height:200px}
  .main .placeholder .ic{font-size:40px}
  .main .caption{font-size:.95rem;padding:8px 18px;bottom:12px}
  .news{height:auto;min-height:50px;flex-wrap:wrap;padding:10px 16px;gap:8px}
  .news-label{font-size:.95rem;border-left:none;padding-left:0}
  .news-item{font-size:.85rem}
  .news-track{animation-duration:35s}
}

/* VERY SMALL PHONE: < 380 */
@media(max-width:379px){
  .rect{padding:12px 16px}
  .rect .txt h2{font-size:1.1rem}
  .rect .ic{font-size:26px}
  .main .caption{font-size:.85rem;padding:6px 14px}
}

/* LANDSCAPE PHONE — compact */
@media(max-height:500px) and (orientation:landscape) and (max-width:1000px){
  .top-row{flex-direction:row}
  .rect{padding:12px 18px}
  .rect .txt h2{font-size:1.1rem}
  .rect .ic{font-size:28px}
  .main{min-height:160px}
  .news{height:48px}
}
</style>
</head>
<body>
<div id="frame">
<div class="wrap">

  <!-- Two colorful rectangles — which library is this -->
  <div class="top-row">
    <div class="rect rect-1">
      <div class="ic">📚</div>
      <div class="txt"><h2>ספריית רחובות</h2><p>הספרייה הציבורית</p></div>
    </div>
    <div class="rect rect-2">
      <div class="ic">🕐</div>
      <div class="txt"><h2 id="clock">--:--</h2><p id="dateStr">--</p></div>
    </div>
  </div>

  <!-- Main — rotating images -->
  <div class="main" id="main">
    <div class="placeholder"><div class="ic">🖼️</div><div class="t">תמונות מהספרייה</div></div>
    <div class="caption" id="caption">ברוכים הבאים</div>
  </div>

  <!-- Bottom — positive news -->
  <div class="news">
    <div class="news-label"><span>😊</span><span>חדשות חיוביות</span></div>
    <div class="news-ticker">
      <div class="news-track" id="newsTrack">
        <div class="news-item"><span class="dot"></span><span>טוען...</span></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// DETECT TV MODE: large landscape screens → lock to 1920x1080 with scaling
function checkTVMode(){
  const isTV = window.innerWidth >= 1280 && window.innerWidth > window.innerHeight && screen.width >= 1280;
  if(isTV){
    document.body.classList.add('tv-mode');
  }else{
    document.body.classList.remove('tv-mode');
  }
}
checkTVMode();
window.addEventListener('resize',checkTVMode);

// SCALE for TV
function scaleFrame(){
  if(document.body.classList.contains('tv-mode')){
    const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.getElementById('frame').style.transform='scale('+s+')';
    document.getElementById('frame').style.transformOrigin='top center';
  }else{
    document.getElementById('frame').style.transform='none';
  }
}
scaleFrame();window.addEventListener('resize',scaleFrame);
window.addEventListener('orientationchange',()=>{setTimeout(()=>{checkTVMode();scaleFrame();},100)});

// CLOCK
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('dateStr').textContent='יום '+days[now.getDay()]+' '+now.getDate()+' ב'+months[now.getMonth()];
}
updateClock();setInterval(updateClock,1000);

// POSITIVE NEWS
async function loadNews(){
  const feeds=[
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.thepositiv.com/feed/',source:'חדשות טובות',filter:true},
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml',source:'Ynet',filter:false}
  ];
  for(const feed of feeds){
    try{
      const res=await fetch(feed.url);
      const data=await res.json();
      if(data.status==='ok'&&data.items&&data.items.length>0){
        let items=data.items;
        if(feed.filter){items=items.filter(i=>!i.title.includes('תוכן ממומן')&&!i.title.includes('פרסומות')&&!i.title.includes('ספונסר')&&!i.title.includes('שיתופי פעולה'));}
        if(items.length===0)continue;
        document.getElementById('newsTrack').innerHTML=items.slice(0,15).map(item=>{
          const t=item.title.replace(/<[^>]*>/g,'').replace(/&[#a-zA-Z0-9]+;/g,'').substring(0,120);
          return `<div class="news-item"><span class="dot"></span><span class="source">${feed.source}</span><span>${t}</span></div>`;
        }).join('');
        return;
      }
    }catch(e){}
  }
  const fb=['בישראל: עלייה במספר המתנדבים','מחקר חדש: תוחלת חיים בעלייה','רשות הטבע: עלייה בבעלי חיים מוגנים','סטודנטים ישראלים זכו במקום ראשון'];
  document.getElementById('newsTrack').innerHTML=fb.map(t=>`<div class="news-item"><span class="dot"></span><span class="source">חדשות טובות</span><span>${t}</span></div>`).join('');
}
loadNews();setInterval(loadNews,300000);
</script>
</body>
</html>
