<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ספריית רחובות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-dark:#2563eb;--orange:#f59e0b;--orange-dark:#f97316;
  --green:#22c55e;--green-dark:#16a34a;--purple:#8b5cf6;--purple-dark:#7c3aed;
  --pad:clamp(6px,1vw,16px);
  --gap:clamp(5px,.7vw,10px);
  --radius:clamp(10px,1.2vw,22px);
  --card-radius:clamp(8px,.8vw,14px);
  --bar-h:clamp(36px,4.5vw,60px);
  --fs-title:clamp(1rem,3vw,3rem);
  --fs-subtitle:clamp(.7rem,1.5vw,1.5rem);
  --fs-clock:clamp(1.1rem,3vw,3rem);
  --fs-clock-date:clamp(.65rem,1.2vw,1.2rem);
  --fs-icon:clamp(20px,3vw,48px);
  --fs-news-head:clamp(.9rem,2vw,2rem);
  --fs-news-card:clamp(.75rem,1.3vw,1.3rem);
  --fs-news-desc:clamp(.65rem,1vw,1rem);
  --fs-ticker:clamp(.75rem,1.4vw,1.4rem);
  --fs-ticker-label:clamp(.8rem,1.5vw,1.5rem);
  --fs-caption:clamp(.8rem,1.8vw,1.8rem);
  --fs-ph-icon:clamp(32px,5vw,64px);
  --fs-ph-text:clamp(.9rem,1.8vw,1.8rem);
}
html{height:100%}
body{height:100%;font-family:'Heebo',system-ui,sans-serif;background:linear-gradient(135deg,#eef2f7,#e0e7f0);color:#1e293b;overflow:hidden}
#frame{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.wrap{width:100%;flex:1;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad);min-height:0;overflow:hidden}
.header{display:flex;gap:var(--gap);flex-shrink:0;align-items:stretch}
.header-left{display:flex;gap:var(--gap);flex:1}
.header-right{flex-shrink:0;width:clamp(120px,12vw,240px)}
.rect{border-radius:var(--radius);padding:clamp(8px,1.2vw,20px) clamp(12px,1.5vw,24px);display:flex;align-items:center;justify-content:center;gap:clamp(6px,.8vw,12px);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.rect-logo{flex:0 0 auto;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}
.rect-title{flex:1;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
.rect-clock{width:100%;height:100%;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;flex-direction:column;gap:clamp(3px,.5vw,8px)}
.rect .ic{font-size:var(--fs-icon);flex-shrink:0}
.rect .txt{text-align:center}
.rect .txt h2{font-size:var(--fs-title);font-weight:900;line-height:1.1}
.rect .txt p{font-size:var(--fs-subtitle);opacity:.85;margin-top:2px}
.rect-clock .clock-num{font-size:var(--fs-clock);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rect-clock .clock-date{font-size:var(--fs-clock-date);opacity:.9}
.body-grid{flex:1;display:flex;gap:var(--gap);min-height:0;overflow:hidden}
.photo-panel{flex:1.3;border-radius:var(--radius);overflow:hidden;position:relative;background:#1e293b;box-shadow:0 6px 18px rgba(0,0,0,.12);min-height:0}
.photo-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;display:flex;align-items:center;justify-content:center}
.photo-slide.on{opacity:1}
.photo-slide img{width:100%;height:100%;object-fit:cover}
.photo-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.5);gap:10px}
.photo-ph .ic{font-size:var(--fs-ph-icon);opacity:.4}
.photo-ph .t{font-size:var(--fs-ph-text);font-weight:700;color:#fff}
.photo-cap{position:absolute;bottom:clamp(8px,1.2vw,18px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;padding:clamp(5px,.8vw,10px) clamp(12px,1.5vw,24px);border-radius:50px;font-size:var(--fs-caption);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap;z-index:5;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.photo-dots{position:absolute;top:clamp(8px,1vw,14px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.photo-dot{width:clamp(5px,.5vw,8px);height:clamp(5px,.5vw,8px);border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s;cursor:pointer}
.photo-dot.active{background:#fff;width:clamp(14px,1.3vw,24px);border-radius:4px}
.news-panel{flex:1;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.news-head{padding:clamp(8px,1vw,18px) clamp(10px,1.3vw,22px);flex-shrink:0;text-align:center;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
.news-head h2{font-size:var(--fs-news-head);font-weight:900}
.news-body{flex:1;overflow:hidden;padding:clamp(8px,1vw,18px) clamp(10px,1.2vw,20px);background:linear-gradient(180deg,#fafbff,#eef2f9);position:relative;min-height:0}
.news-body::before,.news-body::after{content:"";position:absolute;left:0;right:0;height:clamp(16px,1.5vw,28px);z-index:2;pointer-events:none}
.news-body::before{top:0;background:linear-gradient(180deg,#fafbff,transparent)}
.news-body::after{bottom:0;background:linear-gradient(0deg,#eef2f9,transparent)}
.news-scroll{display:flex;flex-direction:column;gap:clamp(6px,.7vw,12px);animation:scrollUp 50s linear infinite}
.news-scroll:hover{animation-play-state:paused}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.news-card{background:#fff;border-radius:var(--card-radius);padding:clamp(8px,1vw,16px) clamp(10px,1.2vw,18px);display:flex;gap:clamp(6px,.8vw,12px);align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.news-card .badge{width:clamp(22px,2vw,36px);height:clamp(22px,2vw,36px);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.1vw,18px);color:#fff;font-weight:800}
.news-card .badge.b-blue{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
.news-card .badge.b-orange{background:linear-gradient(135deg,var(--orange),var(--orange-dark))}
.news-card .badge.b-green{background:linear-gradient(135deg,var(--green),var(--green-dark))}
.news-card .badge.b-purple{background:linear-gradient(135deg,var(--purple),var(--purple-dark))}
.news-card .txt{font-size:var(--fs-news-card);font-weight:600;color:#1e293b;line-height:1.35}
.news-card .src{font-size:clamp(.6rem,.9vw,.85rem);font-weight:800;margin-bottom:2px;color:var(--purple-dark)}
.news-card .event-date{display:inline-block;background:#fef3c7;color:#92400e;font-size:clamp(.6rem,.85vw,.75rem);font-weight:700;padding:2px 8px;border-radius:6px;margin-top:4px}
.news-bar{height:var(--bar-h);flex-shrink:0;display:flex;align-items:center;gap:clamp(8px,1vw,16px);border-radius:var(--radius);background:linear-gradient(135deg,var(--green),var(--green-dark));box-shadow:0 4px 14px rgba(0,0,0,.10);padding:0 clamp(10px,1.3vw,24px);overflow:hidden;margin:0 var(--pad) var(--pad) var(--pad)}
.news-label{display:flex;align-items:center;gap:6px;flex-shrink:0;color:#fff;font-weight:800;font-size:var(--fs-ticker-label);border-left:2px solid rgba(255,255,255,.3);padding-left:clamp(8px,1vw,14px)}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;direction:ltr}
.news-track{display:flex;gap:clamp(20px,2.5vw,40px);white-space:nowrap;direction:ltr;animation:tickerLTR 30s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes tickerLTR{from{transform:translateX(0%)}to{transform:translateX(-50%)}}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:var(--fs-ticker);font-weight:500;direction:rtl}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}
@media(max-width:600px) and (orientation:portrait){
  .header{flex-direction:column}
  .header-left{flex-direction:row}
  .header-right{width:100%}
  .rect-clock{flex-direction:row;gap:10px}
  .body-grid{flex-direction:column;min-height:0}
  .photo-panel{min-height:25vh;flex:none}
  .news-panel{flex:1;min-height:0}
  .news-bar{flex-wrap:wrap;padding:6px 12px;gap:6px}
  .news-label{border-left:none;padding-left:0}
}
@media(max-width:380px){.rect{padding:8px 12px}.rect-clock .clock-num{font-size:1rem}}
</style>
</head>
<body>
<div id="frame">
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <div class="rect rect-logo"><div class="ic">📚</div><div class="txt"><h2>ספריית רחובות</h2></div></div>
      <div class="rect rect-title"><div class="ic">📖</div><div class="txt"><h2>הספרייה הציבורית</h2><p>בית הספר של העם</p></div></div>
    </div>
    <div class="header-right"><div class="rect rect-clock"><div class="clock-num" id="clock">--:--</div><div class="clock-date" id="dateStr">--</div></div></div>
  </div>
  <div class="body-grid">
    <div class="photo-panel" id="photoPanel">
      <div class="photo-dots" id="photoDots"></div>
      <div class="photo-cap" id="caption">ברוכים הבאים</div>
    </div>
    <div class="news-panel">
      <div class="news-head"><h2>חדש בספרייה</h2></div>
      <div class="news-body"><div class="news-scroll" id="newsScroll"><div class="news-card"><div class="badge b-blue">📚</div><div><div class="src">טוען עדכונים...</div></div></div></div></div></div>
    </div>
  </div>
</div>
<div class="news-bar">
  <div class="news-label"><span>😊</span><span>חדשות חיוביות</span></div>
  <div class="news-ticker"><div class="news-track" id="newsTrack"><div class="news-item"><span class="dot"></span><span>טוען...</span></div></div></div>
</div>
</div>
<script>
const CONTENT={
  photos:[
    {title:"שעת סיפור לילדים",image_url:"https://media.base44.com/images/public/69f63b4536d7a2c6688403df/75932f941_generated_image.png"},
    {title:"סופר אורח — חתימות וקריאה",image_url:"https://media.base44.com/images/public/69f63b4536d7a2c6688403df/b90828b91_generated_image.png"},
    {title:"סדנת כתיבה יוצרת",image_url:"https://media.base44.com/images/public/69f63b4536d7a2c6688403df/6f43d3d33_generated_image.png"},
    {title:"סדנת איור לילדים",image_url:"https://media.base44.com/images/public/69f63b4536d7a2c6688403df/3e5595a5c_generated_image.png"}
  ],
  new_in_library:[
    {title:"סופר עמוס עוז עומד להגיע",description:"מפגש עם הסופר עמוס עוז במסגרת פסטיבל הספר",event_date:"15.09.2026",icon:"✍️",badge_color:"blue"},
    {title:"סדנת כתיבה יוצרת",description:"סדנה בהנחיית דפנה שלום — מספר מקומות מוגבל",event_date:"22.09.2026",icon:"📝",badge_color:"orange"},
    {title:"חוג קריאה לילדים",description:"חוג קריאה בהנחיית מירי כהן — כניסה חופשית",event_date:"כל יום שלישי 16:00",icon:"📖",badge_color:"green"},
    {title:"מאגרי מידע חדשים",description:"מאגר חיפה + פרויקט השו״ת — זמינים כעת",event_date:"",icon:"🔍",badge_color:"purple"},
    {title:"מפגש סופרים — שירה וסיפור",description:"ערב ספרותי עם סופרים מהארץ ומחוץ לארץ",event_date:"29.09.2026",icon:"🎭",badge_color:"blue"},
    {title:"סדנת איור לילדים",description:"למדו לצייר ולאייר — כניסה חופשית",event_date:"05.10.2026",icon:"🎨",badge_color:"orange"},
    {title:"קדן — קטלוג מקוון",description:"חיפוש ספרים, הזמנה וחידוש",event_date:"",icon:"💻",badge_color:"green"},
    {title:"מילון רב-מילים",description:"חיפוש מתקדם — עברית, אנגלית, ערבית",event_date:"",icon:"📚",badge_color:"purple"}
  ],
  positive_news:[
    {title:"בישראל: עלייה במספר המתנדבים"},
    {title:"מחקר חדש: תוחלת חיים בעלייה"},
    {title:"רשות הטבע: עלייה בבעלי חיים מוגנים"},
    {title:"סטודנטים ישראלים זכו במקום ראשון בתחרות בינלאומית"},
    {title:"שיא חדש בגיוס תרומות למען נזקקים"},
    {title:"נבחרת ישראל בכדורסל עלתה לדרג ב' האירופי"}
  ]
};
function updateClock(){const now=new Date();document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];document.getElementById('dateStr').textContent='יום '+days[now.getDay()]+' '+now.getDate()+' ב'+months[now.getMonth()]}
updateClock();setInterval(updateClock,1000);
const API_URL='https://app.base44.com/api/apps/69f63b4536d7a2c6688403df/functions/getLibraryContent';
async function loadContent(){
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({library_id:'rehovot'}),signal:AbortSignal.timeout(5000)});
    const result=await res.json();
    if(result.success&&result.data){
      const d=result.data;
      renderLibrary(d.new_in_library&&d.new_in_library.length>0?d.new_in_library:CONTENT.new_in_library);
      renderPositiveNews(d.positive_news&&d.positive_news.length>0?d.positive_news:CONTENT.positive_news);
      renderPhotos(d.photos&&d.photos.length>0?d.photos:CONTENT.photos);
      return;
    }
  }catch(e){console.log('API unavailable, using embedded content')}
  renderLibrary(CONTENT.new_in_library);
  renderPositiveNews(CONTENT.positive_news);
  renderPhotos(CONTENT.photos);
}
function renderLibrary(items){
  if(!items||items.length===0)items=CONTENT.new_in_library;
  const html=items.map(item=>{
    const badge='b-'+(item.badge_color||'blue');
    const dateHtml=item.event_date?'<div class="event-date">📅 '+item.event_date+'</div>':'';
    const descHtml=item.description?'<div class="txt">'+item.title+'</div><div style="font-size:var(--fs-news-desc);color:#64748b;margin-top:2px">'+item.description+'</div>'+dateHtml:'<div class="txt">'+item.title+'</div>'+dateHtml;
    return '<div class="news-card"><div class="badge '+badge+'">'+(item.icon||'📚')+'</div><div>'+descHtml+'</div></div>';
  }).join('');
  document.getElementById('newsScroll').innerHTML=html+html;
}
function renderPositiveNews(items){
  if(!items||items.length===0)items=CONTENT.positive_news;
  const html=items.map(item=>'<div class="news-item"><span class="dot"></span><span>'+item.title+'</span></div>').join('');
  document.getElementById('newsTrack').innerHTML=html+html;
}
function renderPhotos(items){
  if(!items||items.length===0)items=CONTENT.photos;
  if(!items||items.length===0)return;
  const photoPanel=document.getElementById('photoPanel');
  const photoDots=document.getElementById('photoDots');
  document.querySelectorAll('.photo-slide').forEach(s=>s.remove());
  items.forEach((p,i)=>{
    const slide=document.createElement('div');
    slide.className='photo-slide'+(i===0?' on':'');
    if(p.image_url){slide.innerHTML='<img src="'+p.image_url+'" alt="'+(p.title||'')+'">'}
    else{slide.innerHTML='<div class="photo-ph"><div class="ic">🖼️</div><div class="t">'+(p.title||'תמונות מהספרייה')+'</div></div>'}
    photoPanel.insertBefore(slide,photoDots);
  });
  photoDots.innerHTML='';
  items.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='photo-dot'+(i===0?' active':'');
    dot.onclick=()=>gotoPhoto(i,items);
    photoDots.appendChild(dot);
  });
  document.getElementById('caption').textContent=items[0].title||'ברוכים הבאים';
  if(window._photoInterval)clearInterval(window._photoInterval);
  let curPhoto=0;
  window._photoInterval=setInterval(()=>{curPhoto=(curPhoto+1)%items.length;gotoPhoto(curPhoto,items)},7000);
}
function gotoPhoto(n,items){
  document.querySelectorAll('.photo-slide').forEach((s,i)=>s.classList.toggle('on',i===n));
  document.querySelectorAll('.photo-dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  if(items&&items[n])document.getElementById('caption').textContent=items[n].title||'';
}
renderLibrary(CONTENT.new_in_library);
renderPositiveNews(CONTENT.positive_news);
renderPhotos(CONTENT.photos);
loadContent();
setInterval(loadContent,60000);
</script>
</body>
</html>
