<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ספריית רחובות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#3b82f6;--blue-dark:#2563eb;
  --orange:#f59e0b;--orange-dark:#f97316;
  --green:#22c55e;--green-dark:#16a34a;
  --purple:#8b5cf6;--purple-dark:#7c3aed;
  --r:18px;
}
html{height:100%}
body{
  font-family:'Heebo',system-ui,sans-serif;
  background:linear-gradient(135deg,#eef2f7,#e0e7f0);
  color:#1e293b;min-height:100vh;
  -webkit-overflow-scrolling:touch;
}

/* TV mode: lock to 1920x1080 */
body.tv-mode{overflow:hidden;height:100vh}
body.tv-mode #frame{width:1920px;height:1080px;margin:0 auto;transform-origin:top center}

/* All other modes: fluid + scrollable */
body:not(.tv-mode){overflow-y:auto;overflow-x:hidden}
body:not(.tv-mode) #frame{width:100%;min-height:100vh}

.wrap{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px}

/* HEADER: left = two rectangles, right = one square */
.header{display:flex;gap:8px;flex-shrink:0;align-items:stretch}
.header-left{display:flex;gap:8px;flex:1}
.header-right{flex-shrink:0;width:200px}

.rect{
  border-radius:var(--r);padding:18px 22px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.10);
}
.rect-logo{flex:0 0 auto;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}
.rect-title{flex:1;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
.rect-clock{width:100%;height:100%;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;flex-direction:column;gap:6px}

.rect .ic{font-size:32px;flex-shrink:0}
.rect .txt{text-align:center}
.rect .txt h2{font-size:1.4rem;font-weight:900;line-height:1.1}
.rect .txt p{font-size:.8rem;opacity:.85;margin-top:2px}
.rect-clock .clock-num{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rect-clock .clock-date{font-size:.8rem;opacity:.9}

/* BODY: photos (left) + חדש בספרייה (right) */
.body-grid{flex:1;display:flex;gap:8px;min-height:0}

.photo-panel{
  flex:1.3;border-radius:var(--r);overflow:hidden;position:relative;
  background:#1e293b;box-shadow:0 6px 18px rgba(0,0,0,.12);min-height:200px;
}
.photo-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;display:flex;align-items:center;justify-content:center}
.photo-slide.on{opacity:1}
.photo-slide img{width:100%;height:100%;object-fit:cover}
.photo-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.5);gap:10px}
.photo-ph .ic{font-size:48px;opacity:.4}
.photo-ph .t{font-size:1.1rem;font-weight:700;color:#fff}
.photo-cap{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;
  padding:8px 22px;border-radius:50px;font-size:1rem;font-weight:700;
  box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap;z-index:5;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.photo-dots{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.photo-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s;cursor:pointer}
.photo-dot.active{background:#fff;width:20px;border-radius:4px}

.news-panel{
  flex:1;border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;min-height:200px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.news-head{padding:14px 20px;flex-shrink:0;text-align:center;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff}
.news-head h2{font-size:1.3rem;font-weight:900}
.news-body{flex:1;overflow:hidden;padding:14px 18px;background:linear-gradient(180deg,#fafbff,#eef2f9);position:relative}
.news-body::before,.news-body::after{content:"";position:absolute;left:0;right:0;height:24px;z-index:2;pointer-events:none}
.news-body::before{top:0;background:linear-gradient(180deg,#fafbff,transparent)}
.news-body::after{bottom:0;background:linear-gradient(0deg,#eef2f9,transparent)}
.news-scroll{display:flex;flex-direction:column;gap:10px;animation:scrollUp 45s linear infinite}
.news-scroll:hover{animation-play-state:paused}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.news-card{background:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.news-card .badge{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800}
.news-card .badge.b1{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
.news-card .badge.b2{background:linear-gradient(135deg,var(--orange),var(--orange-dark))}
.news-card .badge.b3{background:linear-gradient(135deg,var(--green),var(--green-dark))}
.news-card .badge.b4{background:linear-gradient(135deg,var(--purple),var(--purple-dark))}
.news-card .txt{font-size:.9rem;font-weight:600;color:#1e293b;line-height:1.35}
.news-card .src{font-size:.7rem;font-weight:800;margin-bottom:2px;color:var(--purple-dark)}

/* BOTTOM: slow positive news */
.news-bar{
  height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;
  border-radius:var(--r);background:linear-gradient(135deg,var(--green),var(--green-dark));
  box-shadow:0 4px 14px rgba(0,0,0,.10);padding:0 20px;overflow:hidden;
}
.news-label{display:flex;align-items:center;gap:6px;flex-shrink:0;color:#fff;font-weight:800;font-size:1rem;border-left:2px solid rgba(255,255,255,.3);padding-left:12px}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.news-track{display:flex;gap:36px;white-space:nowrap;animation:scrollH 120s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes scrollH{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:.95rem;font-weight:500}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}
.news-item .source{background:rgba(255,255,255,.25);font-weight:800;font-size:.75rem;padding:2px 7px;border-radius:6px}

/* LAPTOP 1280-1919 */
@media(min-width:1280px) and (max-width:1919px){
  body:not(.tv-mode) #frame{max-width:1600px;margin:0 auto}
  .header-right{width:180px}
  .rect .txt h2{font-size:1.3rem}
  .rect-clock .clock-num{font-size:1.5rem}
}

/* TABLET 768-1279 */
@media(min-width:768px) and (max-width:1279px){
  body:not(.tv-mode) #frame{max-width:1024px;margin:0 auto}
  .header-right{width:150px}
  .rect{padding:14px 18px}
  .rect .ic{font-size:26px}
  .rect .txt h2{font-size:1.1rem}
  .rect .txt p{font-size:.72rem}
  .rect-clock .clock-num{font-size:1.3rem}
  .rect-clock .clock-date{font-size:.72rem}
  .news-head h2{font-size:1.1rem}
  .news-bar{height:50px}
  .news-label{font-size:.9rem}
  .news-item{font-size:.85rem}
}

/* MOBILE < 768 — stack everything */
@media(max-width:767px){
  body:not(.tv-mode){padding:6px}
  body:not(.tv-mode) #frame{width:100%}
  .header{flex-direction:column}
  .header-left{flex-direction:row}
  .header-right{width:100%}
  .rect{padding:12px 16px}
  .rect .ic{font-size:24px}
  .rect .txt h2{font-size:1.1rem}
  .rect .txt p{font-size:.7rem}
  .rect-clock{flex-direction:row;gap:10px}
  .rect-clock .clock-num{font-size:1.3rem}
  .rect-clock .clock-date{font-size:.7rem}
  .body-grid{flex-direction:column;min-height:auto}
  .photo-panel{min-height:180px}
  .news-panel{min-height:180px}
  .photo-ph .ic{font-size:36px}
  .photo-cap{font-size:.85rem;padding:6px 16px;bottom:10px}
  .news-bar{height:auto;min-height:44px;flex-wrap:wrap;padding:8px 14px;gap:6px}
  .news-label{font-size:.85rem;border-left:none;padding-left:0}
  .news-item{font-size:.8rem}
  .news-track{animation-duration:90s}
}

/* VERY SMALL PHONE < 380 */
@media(max-width:379px){
  .rect{padding:10px 14px}
  .rect .txt h2{font-size:.95rem}
  .rect .ic{font-size:20px}
  .rect-clock .clock-num{font-size:1.1rem}
  .photo-cap{font-size:.75rem;padding:5px 12px}
}

/* LANDSCAPE PHONE — crucial: when you rotate phone to landscape */
@media(max-height:500px) and (orientation:landscape) and (max-width:1000px){
  body:not(.tv-mode) #frame{width:100%;min-height:auto}
  .wrap{gap:6px;padding:6px}
  .header{flex-direction:row}
  .header-left{flex-direction:row;flex:1}
  .header-right{width:140px;flex-shrink:0}
  .rect{padding:8px 14px}
  .rect .ic{font-size:22px}
  .rect .txt h2{font-size:.95rem}
  .rect .txt p{font-size:.65rem}
  .rect-clock{flex-direction:column;gap:2px}
  .rect-clock .clock-num{font-size:1.1rem}
  .rect-clock .clock-date{font-size:.65rem}
  .body-grid{flex-direction:row;flex:1;min-height:0}
  .photo-panel{min-height:120px}
  .news-panel{min-height:120px}
  .news-head{padding:8px 14px}
  .news-head h2{font-size:1rem}
  .news-body{padding:10px 14px}
  .news-card{padding:8px 12px}
  .news-card .txt{font-size:.8rem}
  .news-bar{height:40px;padding:0 14px}
  .news-label{font-size:.8rem}
  .news-item{font-size:.75rem}
  .news-track{animation-duration:90s}
  .photo-cap{font-size:.8rem;padding:5px 14px;bottom:8px}
  .photo-dots{top:8px}
  .photo-dot{width:6px;height:6px}
}

/* LANDSCAPE TABLET */
@media(max-height:800px) and (min-width:768px) and (orientation:landscape) and (max-width:1279px){
  .header-right{width:140px}
  .rect{padding:12px 16px}
  .rect .txt h2{font-size:1rem}
  .rect-clock .clock-num{font-size:1.2rem}
  .news-head{padding:10px 16px}
  .news-head h2{font-size:1rem}
  .news-bar{height:46px}
}
</style>
</head>
<body>
<div id="frame">
<div class="wrap">

  <!-- HEADER: left = 2 rectangles (logo + title), right = 1 square (clock) -->
  <div class="header">
    <div class="header-left">
      <div class="rect rect-logo">
        <div class="ic">📚</div>
        <div class="txt"><h2>ספריית רחובות</h2></div>
      </div>
      <div class="rect rect-title">
        <div class="ic">📖</div>
        <div class="txt"><h2>הספרייה הציבורית</h2><p>בית הספר של העם</p></div>
      </div>
    </div>
    <div class="header-right">
      <div class="rect rect-clock">
        <div class="clock-num" id="clock">--:--</div>
        <div class="clock-date" id="dateStr">--</div>
      </div>
    </div>
  </div>

  <!-- BODY: photos (left, wider) + חדש בספרייה (right) -->
  <div class="body-grid">
    <div class="photo-panel" id="photoPanel">
      <div class="photo-dots" id="photoDots"></div>
      <div class="photo-cap" id="caption">ברוכים הבאים</div>
    </div>
    <div class="news-panel">
      <div class="news-head"><h2>חדש בספרייה</h2></div>
      <div class="news-body">
        <div class="news-scroll" id="newsScroll">
          <div class="news-card"><div class="badge b1">📚</div><div><div class="src">עדכון</div><div class="txt">טוען...</div></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM: slow positive news -->
  <div class="news-bar">
    <div class="news-label"><span>😊</span><span>חדשות חיוביות</span></div>
    <div class="news-ticker">
      <div class="news-track" id="newsTrack">
        <div class="news-item"><span class="dot"></span><span>טוען...</span></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// TV mode
function checkTVMode(){
  const isTV=window.innerWidth>=1280&&window.innerWidth>window.innerHeight&&screen.width>=1280;
  if(isTV){document.body.classList.add('tv-mode')}else{document.body.classList.remove('tv-mode')}
}
function scaleFrame(){
  if(document.body.classList.contains('tv-mode')){
    const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.getElementById('frame').style.transform='scale('+s+')';
    document.getElementById('frame').style.transformOrigin='top center';
  }else{document.getElementById('frame').style.transform='none'}
}
checkTVMode();scaleFrame();
window.addEventListener('resize',()=>{checkTVMode();scaleFrame()});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{checkTVMode();scaleFrame()},200)});

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('dateStr').textContent='יום '+days[now.getDay()]+' '+now.getDate()+' ב'+months[now.getMonth()];
}
updateClock();setInterval(updateClock,1000);

// Photos
const photos=[
  {title:'ספריית רחובות',url:''},
  {title:'סדנת כתיבה יוצרת · 15.9',url:''},
  {title:'מפגש סופרים · 22.9',url:''}
];
const photoPanel=document.getElementById('photoPanel');
const photoDots=document.getElementById('photoDots');
let curPhoto=0;
function renderPhotos(){
  document.querySelectorAll('.photo-slide').forEach(s=>s.remove());
  photos.forEach((p,i)=>{
    const slide=document.createElement('div');
    slide.className='photo-slide'+(i===0?' on':'');
    if(p.url){slide.innerHTML=`<img src="${p.url}" alt="${p.title}">`}
    else{
      const emojis=['📚','✍️','📖','🎨','🎭'];
      slide.innerHTML=`<div class="photo-ph"><div class="ic">${emojis[i%emojis.length]}</div><div class="t">תמונות מהספרייה</div></div>`;
    }
    photoPanel.insertBefore(slide,photoDots);
  });
  photoDots.innerHTML='';
  photos.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='photo-dot'+(i===0?' active':'');
    dot.onclick=()=>gotoPhoto(i);
    photoDots.appendChild(dot);
  });
  document.getElementById('caption').textContent=photos[0].title;
}
function gotoPhoto(n){
  curPhoto=n;
  document.querySelectorAll('.photo-slide').forEach((s,i)=>s.classList.toggle('on',i===n));
  document.querySelectorAll('.photo-dot').forEach((d,i)=>s=>d.classList.toggle('active',i===n));
  document.querySelectorAll('.photo-dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  document.getElementById('caption').textContent=photos[n].title;
}
renderPhotos();
setInterval(()=>gotoPhoto((curPhoto+1)%photos.length),7000);

// חדש בספרייה
async function loadLibraryNews(){
  const items=[
    {icon:'📚',badge:'b1',src:'ספרייה',text:'מאגרי מידע לשימושכם — כניסה דרך מחשבי הספרייה'},
    {icon:'📖',badge:'b2',src:'ספרייה',text:'מאגר חיפה למאמרים בעברית'},
    {icon:'✍️',badge:'b3',src:'ספרייה',text:'סדנת כתיבה יוצרת — 15 בספטמבר'},
    {icon:'🎭',badge:'b4',src:'ספרייה',text:'מפגש סופרים — 22 בספטמבר'},
    {icon:'📚',badge:'b1',src:'ספרייה',text:'פרויקט השו״ת המקוון זמין כעת'},
    {icon:'📖',badge:'b2',src:'ספרייה',text:'מילון רב-מילים — חיפוש מתקדם'},
    {icon:'🎨',badge:'b3',src:'ספרייה',text:'סדנת איור — כניסה חופשית'},
    {icon:'📚',badge:'b4',src:'ספרייה',text:'קדן — קטלוג הספרייה המקוון'}
  ];
  try{
    const res=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml');
    const data=await res.json();
    if(data.status==='ok'&&data.items&&data.items.length>0){
      const live=data.items.slice(0,5).map((item,i)=>({
        icon:'📰',badge:'b'+((i%4)+1),src:'Ynet',
        text:item.title.replace(/<[^>]*>/g,'').substring(0,85)
      }));
      const all=[...items,...live];
      const html=all.map(it=>`<div class="news-card"><div class="badge ${it.badge}">${it.icon}</div><div><div class="src">${it.src}</div><div class="txt">${it.text}</div></div></div>`).join('');
      document.getElementById('newsScroll').innerHTML=html+html;
      return;
    }
  }catch(e){}
  const html=items.map(it=>`<div class="news-card"><div class="badge ${it.badge}">${it.icon}</div><div><div class="src">${it.src}</div><div class="txt">${it.text}</div></div></div>`).join('');
  document.getElementById('newsScroll').innerHTML=html+html;
}
loadLibraryNews();setInterval(loadLibraryNews,300000);

// Slow positive news
async function loadPositiveNews(){
  const feeds=[
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.thepositiv.com/feed/',source:'חדשות טובות',filter:true},
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml',source:'Ynet',filter:false}
  ];
  for(const feed of feeds){
    try{
      const res=await fetch(feed.url);
      const data=await res.json();
      if(data.status==='ok'&&data.items&&data.items.length>0){
        let items=data.items;
        if(feed.filter){items=items.filter(i=>!i.title.includes('תוכן ממומן')&&!i.title.includes('פרסומות')&&!i.title.includes('ספונסר')&&!i.title.includes('שיתופי פעולה'))}
        if(items.length===0)continue;
        document.getElementById('newsTrack').innerHTML=items.slice(0,15).map(item=>{
          const t=item.title.replace(/<[^>]*>/g,'').replace(/&[#a-zA-Z0-9]+;/g,'').substring(0,120);
          return `<div class="news-item"><span class="dot"></span><span class="source">${feed.source}</span><span>${t}</span></div>`;
        }).join('');
        return;
      }
    }catch(e){}
  }
  const fb=['בישראל: עלייה במספר המתנדבים','מחקר חדש: תוחלת חיים בעלייה','רשות הטבע: עלייה בבעלי חיים מוגנים','סטודנטים ישראלים זכו במקום ראשון'];
  document.getElementById('newsTrack').innerHTML=fb.map(t=>`<div class="news-item"><span class="dot"></span><span class="source">חדשות טובות</span><span>${t}</span></div>`).join('');
}
loadPositiveNews();setInterval(loadPositiveNews,300000);
</script>
</body>
</html>
