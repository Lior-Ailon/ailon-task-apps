<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ספריית רחובות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',system-ui,sans-serif;overflow:hidden;background:#f5f5f5;height:100vh;width:100vw;padding:8px}
#frame{width:100%;height:100%}
@media(orientation:landscape) and (min-width:1101px){
  #frame{width:1920px;height:1080px;margin:0 auto;transform-origin:top center}
}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;gap:10px}

/* Two colorful header rectangles */
.top-row{display:flex;gap:10px;flex-shrink:0}
.rect{
  flex:1;border-radius:20px;padding:28px 32px;display:flex;align-items:center;justify-content:center;
  gap:14px;box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.rect-1{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.rect-2{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.rect .ic{font-size:48px}
.rect .txt{text-align:center}
.rect .txt h2{font-size:2rem;font-weight:900;line-height:1.1}
.rect .txt p{font-size:1rem;opacity:.85;margin-top:4px}

/* Main area — images or content */
.main{flex:1;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);position:relative;background:#1e293b}
.main img{width:100%;height:100%;object-fit:cover}
.main .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.5);gap:12px}
.main .placeholder .ic{font-size:56px;opacity:.4}
.main .placeholder .t{font-size:1.2rem;font-weight:700;color:#fff}
.main .caption{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:10px 28px;border-radius:50px;font-size:1.1rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}

/* Bottom — positive news ticker */
.news{height:72px;flex-shrink:0;display:flex;align-items:center;gap:14px;border-radius:20px;background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 6px 18px rgba(0,0,0,.12);padding:0 24px;overflow:hidden}
.news-label{display:flex;align-items:center;gap:8px;flex-shrink:0;color:#fff;font-weight:800;font-size:1.1rem;border-left:2px solid rgba(255,255,255,.3);padding-left:14px}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.news-track{display:flex;gap:36px;white-space:nowrap;animation:scroll 55s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.news-item{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:1rem;font-weight:500}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;flex-shrink:0}
.news-item .source{background:rgba(255,255,255,.25);font-weight:800;font-size:.8rem;padding:2px 8px;border-radius:6px}

@media(max-width:1100px){
  .top-row{flex-direction:column}
  .rect .txt h2{font-size:1.4rem}
  .news{height:auto;min-height:60px;flex-wrap:wrap;padding:12px}
}
</style>
</head>
<body>
<div id="frame">
<div class="wrap">

  <!-- Two colorful rectangles — which library is this -->
  <div class="top-row">
    <div class="rect rect-1">
      <div class="ic">📚</div>
      <div class="txt"><h2>ספריית רחובות</h2><p>הספרייה הציבורית</p></div>
    </div>
    <div class="rect rect-2">
      <div class="ic">🕐</div>
      <div class="txt"><h2 id="clock">--:--</h2><p id="dateStr">--</p></div>
    </div>
  </div>

  <!-- Main — rotating images -->
  <div class="main" id="main">
    <div class="placeholder"><div class="ic">🖼️</div><div class="t">תמונות מהספרייה</div></div>
    <div class="caption" id="caption">ברוכים הבאים</div>
  </div>

  <!-- Bottom — positive news -->
  <div class="news">
    <div class="news-label"><span>😊</span><span>חדשות חיוביות</span></div>
    <div class="news-ticker">
      <div class="news-track" id="newsTrack">
        <div class="news-item"><span class="dot"></span><span>טוען...</span></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('dateStr').textContent='יום '+days[now.getDay()]+' '+now.getDate()+' ב'+months[now.getMonth()];
}
updateClock();setInterval(updateClock,1000);

// Scale
function scaleFrame(){
  const f=document.getElementById('frame');
  if(window.innerWidth>1100&&window.innerWidth>window.innerHeight){
    const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    f.style.transform='scale('+s+')';f.style.transformOrigin='top center';
  }else{f.style.transform='none'}
}
scaleFrame();window.addEventListener('resize',scaleFrame);

// Positive news
async function loadNews(){
  const feeds=[
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.thepositiv.com/feed/',source:'חדשות טובות',filter:true},
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml',source:'Ynet',filter:false}
  ];
  for(const feed of feeds){
    try{
      const res=await fetch(feed.url);
      const data=await res.json();
      if(data.status==='ok'&&data.items&&data.items.length>0){
        let items=data.items;
        if(feed.filter){items=items.filter(i=>!i.title.includes('תוכן ממומן')&&!i.title.includes('פרסומות')&&!i.title.includes('ספונסר')&&!i.title.includes('שיתופי פעולה'));}
        if(items.length===0)continue;
        document.getElementById('newsTrack').innerHTML=items.slice(0,15).map(item=>{
          const t=item.title.replace(/<[^>]*>/g,'').replace(/&[#a-zA-Z0-9]+;/g,'').substring(0,120);
          return `<div class="news-item"><span class="dot"></span><span class="source">${feed.source}</span><span>${t}</span></div>`;
        }).join('');
        return;
      }
    }catch(e){}
  }
  const fb=['בישראל: עלייה במספר המתנדבים','מחקר חדש: תוחלת חיים בעלייה','רשות הטבע: עלייה בבעלי חיים מוגנים','סטודנטים ישראלים זכו במקום ראשון'];
  document.getElementById('newsTrack').innerHTML=fb.map(t=>`<div class="news-item"><span class="dot"></span><span class="source">חדשות טובות</span><span>${t}</span></div>`).join('');
}
loadNews();setInterval(loadNews,300000);
</script>
</body>
</html>
