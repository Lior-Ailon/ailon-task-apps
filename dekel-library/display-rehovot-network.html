<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>רשת ספריות רחובות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-deep:#1e4a3d;--green:#2f6b57;--green-soft:#e3ece6;
  --sage:#93ab97;--gold:#d9a441;--card:#f7f2e8;--card-2:#fdfaf4;
  --edge:#e6ddcb;--ink:#2b3330;--ink-soft:#7d857f;
  --r:22px;--r-sm:16px;
  --shadow:0 6px 20px rgba(70,55,30,.10);
  --shadow-lg:0 14px 34px rgba(70,55,30,.16);
}
html,body{height:100%;width:100%}
body{font-family:'Heebo',system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#14201c;margin:0;padding:6px}
#tvFrame{width:100%;height:100%;box-sizing:border-box}
@media(orientation:landscape) and (min-width:1101px){
  #tvFrame{width:1920px;height:1080px;flex-shrink:0;margin:0 auto;transform-origin:center center}
}
.stage{
  position:relative;height:100%;border-radius:10px;overflow:hidden;
  padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 3px,rgba(0,0,0,.03) 3px 7px,rgba(255,255,255,.05) 7px 12px,rgba(0,0,0,.05) 12px 17px),
    linear-gradient(180deg,#d5c4a3 0%, #c6b190 45%, #bda682 100%);
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 0%, rgba(255,255,255,.30), transparent 60%)}

/* HEADER — logo | title | date-time-temp */
.top{display:grid;grid-template-columns:220px 1fr 300px;gap:14px}
.logo-box{
  background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  gap:10px;padding:10px;
}
.logo-box .ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green-deep));
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.logo-box .txt{font-size:1.05rem;font-weight:800;color:var(--green-deep);line-height:1.1}

.title-bar{
  background:linear-gradient(160deg,var(--green),var(--green-deep));border-radius:var(--r);
  box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;
  padding:10px 20px;position:relative;
}
.title-bar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:-.01em}

.datetime-box{
  background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  gap:14px;padding:10px 16px;
}
.datetime-box .clock{font-size:2rem;font-weight:900;color:var(--green-deep);font-variant-numeric:tabular-nums;line-height:1}
.datetime-box .meta{text-align:right;border-right:1px solid var(--edge);padding-right:12px}
.datetime-box .d1{font-size:.85rem;color:var(--ink-soft)}
.datetime-box .d2{font-size:.85rem;color:var(--green);font-weight:700;margin-top:2px}
.datetime-box .wx{display:flex;align-items:center;gap:5px;margin-top:5px;color:var(--ink-soft);font-size:.82rem}
.datetime-box .wx b{font-size:1rem;color:var(--green-deep)}

/* BODY — two equal panels */
.body-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}

.panel{
  background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  min-height:0;overflow:hidden;
}
.panel-head{
  padding:14px 20px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(160deg,var(--green),var(--green-deep));color:#fff;flex-shrink:0;
}
.panel-head .ic{font-size:22px}
.panel-head .t{font-size:1.2rem;font-weight:800}

/* Left panel — rotating photos */
.photo-stage{flex:1;position:relative;min-height:0}
.photo-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s ease}
.photo-slide.on{opacity:1}
.photo-slide img{width:100%;height:100%;object-fit:cover}
.photo-slide .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(10,30,25,.85),transparent);padding:20px 24px;color:#fff}
.photo-slide .overlay h3{font-size:1.4rem;font-weight:800}
.photo-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);gap:14px;text-align:center}
.photo-placeholder .ic{font-size:56px;opacity:.35}
.photo-placeholder .t{font-size:1.15rem;font-weight:700;color:var(--green-deep)}
.photo-placeholder .s{font-size:.9rem;opacity:.7}
.photo-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.photo-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s}
.photo-dot.active{background:#fff;width:26px;border-radius:5px}

/* Right panel — RSS scrolling upward (vertical ticker) */
.rss-vstage{flex:1;position:relative;overflow:hidden;padding:0 20px}
.rss-vstage::before,.rss-vstage::after{
  content:"";position:absolute;left:0;right:0;height:36px;z-index:2;pointer-events:none;
}
.rss-vstage::before{top:0;background:linear-gradient(180deg,var(--card-2),transparent)}
.rss-vstage::after{bottom:0;background:linear-gradient(0deg,var(--card),transparent)}
.rss-vtrack{display:flex;flex-direction:column;gap:14px;animation:scrollUp 40s linear infinite;padding:16px 0}
.rss-vtrack:hover{animation-play-state:paused}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.rss-vitem{
  background:var(--card-2);border:1px solid var(--edge);border-radius:var(--r-sm);
  padding:12px 16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 2px 8px rgba(70,55,30,.05);
}
.rss-vitem .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px}
.rss-vitem .txt{font-size:.95rem;color:var(--ink);line-height:1.4;font-weight:500}
.rss-vitem .src{font-size:.75rem;color:var(--green);font-weight:800;margin-bottom:2px}

/* BOTTOM — positive news horizontal ticker */
.news-bar{
  height:76px;flex-shrink:0;display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,var(--green-deep),var(--green));
  border-radius:var(--r);padding:0 24px;box-shadow:var(--shadow-lg);overflow:hidden;
}
.news-label{
  display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--gold);font-weight:800;font-size:1.1rem;
  border-left:2px solid rgba(255,255,255,.2);padding-left:16px;
}
.news-label .ic{font-size:22px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.news-ticker{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.news-track{display:flex;gap:40px;white-space:nowrap;animation:scrollH 55s linear infinite}
.news-track:hover{animation-play-state:paused}
@keyframes scrollH{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.news-item{display:inline-flex;align-items:center;gap:10px;color:rgba(255,255,255,.92);font-size:1rem;font-weight:500}
.news-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.news-item .source{color:var(--gold);font-weight:700;font-size:.85rem}

@media(max-width:1100px){
  .top{grid-template-columns:1fr}
  .body-grid{grid-template-columns:1fr}
  .title-bar h1{font-size:1.5rem}
  .datetime-box .clock{font-size:1.5rem}
  .news-bar{height:auto;min-height:60px;flex-wrap:wrap;padding:12px}
}
</style>
</head>
<body>
<div id="tvFrame">
<div class="stage">

  <!-- HEADER: logo | title | date/time/temp -->
  <div class="top">
    <div class="logo-box">
      <div class="ic">📚</div>
      <div class="txt">רשת<br>ספריות</div>
    </div>
    <div class="title-bar">
      <h1>רשת ספריות רחובות</h1>
    </div>
    <div class="datetime-box">
      <div class="meta">
        <div class="d1" id="dateStr">--</div>
        <div class="d2" id="dayStr">--</div>
        <div class="wx"><span>🌡️</span><b id="tempVal">--°</b></div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </div>

  <!-- BODY: two equal panels -->
  <div class="body-grid">
    <!-- LEFT: rotating photos -->
    <div class="panel">
      <div class="panel-head"><span class="ic">🖼️</span><span class="t">תמונות מתחלפות</span></div>
      <div class="photo-stage" id="photoStage">
        <div class="photo-dots" id="photoDots"></div>
      </div>
    </div>

    <!-- RIGHT: RSS scrolling upward -->
    <div class="panel">
      <div class="panel-head"><span class="ic">📰</span><span class="t">חדשות ועדכונים</span></div>
      <div class="rss-vstage">
        <div class="rss-vtrack" id="rssVTrack">
          <div class="rss-vitem"><span class="dot"></span><div class="txt">טוען עדכונים...</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM: positive news ticker -->
  <div class="news-bar">
    <div class="news-label"><span class="ic">😊</span><span>חדשות חיוביות</span></div>
    <div class="news-ticker">
      <div class="news-track" id="newsTrack">
        <div class="news-item"><span class="dot"></span><span>טוען חדשות חיוביות...</span></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// CLOCK
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('dateStr').textContent=now.getDate()+' '+months[now.getMonth()];
  document.getElementById('dayStr').textContent='יום '+days[now.getDay()];
}
updateClock();setInterval(updateClock,1000);

// WEATHER (Rehovot coordinates, no API key needed — open-meteo)
async function loadWeather(){
  try{
    const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.8928&longitude=34.8113&current_weather=true');
    const data=await res.json();
    if(data.current_weather){
      document.getElementById('tempVal').textContent=Math.round(data.current_weather.temperature)+'°C';
    }
  }catch(e){document.getElementById('tempVal').textContent='--°'}
}
loadWeather();setInterval(loadWeather,900000); // every 15 min

// SCALE TO FIT
function scaleFrame(){
  const frame=document.getElementById('tvFrame');
  if(window.innerWidth>1100&&window.innerWidth>window.innerHeight){
    const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    frame.style.transform='scale('+s+')';frame.style.transformOrigin='top center';
  }else{frame.style.transform='none'}
}
scaleFrame();window.addEventListener('resize',scaleFrame);

// ROTATING PHOTOS
const samplePhotos=[
  {title:'ספריית רחובות',url:''},
  {title:'סדנת כתיבה יוצרת · 15.9',url:''},
  {title:'מפגש סופרים · 22.9',url:''}
];
const photoStage=document.getElementById('photoStage');
const photoDots=document.getElementById('photoDots');
let curPhoto=0;
function renderPhotos(){
  document.querySelectorAll('.photo-slide').forEach(s=>s.remove());
  samplePhotos.forEach((p,i)=>{
    const slide=document.createElement('div');
    slide.className='photo-slide'+(i===0?' on':'');
    if(p.url){
      slide.innerHTML=`<img src="${p.url}" alt="${p.title}"><div class="overlay"><h3>${p.title}</h3></div>`;
    }else{
      const emojis=['📚','✍️','🎭','🎨','📖'];
      slide.innerHTML=`<div class="photo-placeholder"><div class="ic">${emojis[i%emojis.length]}</div><div class="t">${p.title}</div><div class="s">העלו תמונות דרך ממשק הניהול</div></div>`;
    }
    photoStage.insertBefore(slide,photoDots);
  });
  photoDots.innerHTML='';
  samplePhotos.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='photo-dot'+(i===0?' active':'');
    dot.onclick=()=>gotoPhoto(i);
    photoDots.appendChild(dot);
  });
}
function gotoPhoto(n){
  curPhoto=n;
  document.querySelectorAll('.photo-slide').forEach((s,i)=>s.classList.toggle('on',i===n));
  document.querySelectorAll('.photo-dot').forEach((d,i)=>d.classList.toggle('active',i===n));
}
renderPhotos();
setInterval(()=>gotoPhoto((curPhoto+1)%samplePhotos.length),7000);

// RIGHT PANEL — general RSS scrolling upward (Ynet)
async function loadVerticalRSS(){
  try{
    const res=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml');
    const data=await res.json();
    if(data.status==='ok'&&data.items&&data.items.length>0){
      const items=data.items.slice(0,10);
      const html=items.map(item=>{
        const title=item.title.replace(/<[^>]*>/g,'').substring(0,90);
        return `<div class="rss-vitem"><span class="dot"></span><div><div class="src">Ynet</div><div class="txt">${title}</div></div></div>`;
      }).join('');
      // duplicate for seamless loop
      document.getElementById('rssVTrack').innerHTML=html+html;
      return;
    }
  }catch(e){}
  const fb=['שירות הספריות הציבורי מרחיב שעות פעילות','ספריית רחובות מוסיפה מדור ספרי אודיו','מבצע קריאה לילדים לקראת החגים'];
  const html=fb.map(t=>`<div class="rss-vitem"><span class="dot"></span><div><div class="src">עדכון</div><div class="txt">${t}</div></div></div>`).join('');
  document.getElementById('rssVTrack').innerHTML=html+html;
}
loadVerticalRSS();setInterval(loadVerticalRSS,300000);

// BOTTOM — positive news horizontal (The Positiv + Ynet fallback)
async function loadPositiveNews(){
  const feeds=[
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.thepositiv.com/feed/',source:'חדשות טובות',filter:true},
    {url:'https://api.rss2json.com/v1/api.json?rss_url=https://www.ynet.co.il/Integration/StoryRss2.xml',source:'Ynet',filter:false}
  ];
  for(const feed of feeds){
    try{
      const res=await fetch(feed.url);
      const data=await res.json();
      if(data.status==='ok'&&data.items&&data.items.length>0){
        let items=data.items;
        if(feed.filter){
          items=items.filter(item=>!item.title.includes('תוכן ממומן')&&!item.title.includes('פרסומות')&&!item.title.includes('ספונסר')&&!item.title.includes('שיתופי פעולה'));
        }
        if(items.length===0)continue;
        document.getElementById('newsTrack').innerHTML=items.slice(0,15).map(item=>{
          const title=item.title.replace(/<[^>]*>/g,'').replace(/&[#a-zA-Z0-9]+;/g,'').substring(0,120);
          return `<div class="news-item"><span class="dot"></span><span class="source">${feed.source}</span><span>${title}</span></div>`;
        }).join('');
        return;
      }
    }catch(e){}
  }
  const fb=['בישראל: עלייה במספר המתנדבים','מחקר חדש: תוחלת חיים בעלייה','רשות הטבע: עלייה בבעלי חיים מוגנים','סטודנטים ישראלים זכו במקום ראשון'];
  document.getElementById('newsTrack').innerHTML=fb.map(t=>`<div class="news-item"><span class="dot"></span><span class="source">חדשות טובות</span><span>${t}</span></div>`).join('');
}
loadPositiveNews();setInterval(loadPositiveNews,300000);
</script>
</body>
</html>
